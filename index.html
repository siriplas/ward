<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>งานวันนี้</title>
<style>
:root{--g:#0f5f55;--g2:#0f766e;--bg:#f4f6f5;--tx:#17201d;--mu:#5f6e69;--ln:#e2e8e6;--or:#c2610c;--orbg:#fffaf3;--orln:#f2c48d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:15px}
header{background:var(--hd,var(--g));color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.date{font-size:13px;color:rgba(255,255,255,.85)}
h1{margin:0;font-size:21px}
.pill{background:#fff;color:var(--hd,var(--g));border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.chip{flex-shrink:0;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff}
.chip.on{background:#fff;color:var(--hd,var(--g));border-color:#fff;font-weight:600}
.dnav{display:flex;gap:6px;margin-top:8px}
.dn{min-height:34px;min-width:44px;border:1px solid rgba(255,255,255,.55);border-radius:8px;background:transparent;color:#fff;font-size:18px}
.dn.mid{flex:1;font-size:14px;opacity:1;color:#fff}.dn.today{font-size:14px;padding:0 12px;background:#fff;color:var(--hd,var(--g));font-weight:600;border-color:#fff}.dn.mid.on{background:rgba(255,255,255,.2)}
.tabs{display:flex;background:rgba(0,0,0,.18);border-radius:10px;padding:3px;margin-top:10px}
.tab{flex:1;min-height:34px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.85)}
.tab.on{background:#fff;color:var(--hd,var(--g));font-weight:600}
.ww{font-size:13px;color:#1e3a8a;background:#eef2ff;border-radius:6px;padding:3px 8px;margin-top:4px;display:inline-block}
.gbar{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid #dde3e1}
.gchip{flex-shrink:0;min-height:32px;padding:2px 12px;border-radius:999px;border:1px solid #cdd6d3;background:#fff;color:#3c4a46;font-size:14px}
.gchip.on{background:var(--hd,var(--g));border-color:var(--hd,var(--g));color:#fff;font-weight:600}
.gchip.warn{border-color:#f1b5ae;color:#b42318}.gchip.warn.on{background:#b42318;color:#fff}
.who{font-size:12px;color:var(--mu);margin-top:2px}.nobody{color:#b42318;font-weight:600}
.hn{font-weight:400;font-size:13px;color:var(--mu)}
.badge.res{color:#1e3a8a;background:#e6edff}
.badge.ok{color:#0b4d45;background:#dff3ee}
.badge{font-size:12px;font-weight:600;color:#7a3d00;background:#ffe8cc;border-radius:999px;padding:2px 10px;flex-shrink:0}
.hist{border-left:3px solid #e2e8e6;padding-left:10px;display:flex;flex-direction:column;gap:6px}
.notice{background:#fff7e6;border-bottom:1px solid #f0dfb8;padding:8px 16px;font-size:14px;color:#6b4e0f}
main{padding:12px 12px 120px;display:flex;flex-direction:column;gap:14px}
.sec{font-size:13px;font-weight:600;color:#4b5a55;padding:0 4px;margin-bottom:6px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.pthead{display:flex;justify-content:space-between;padding:10px 14px 4px;font-weight:700}
.pthead span{font-weight:400;font-size:12px;color:var(--mu)}
.task{border-top:1px solid #eef2f1}
.pthead+.task{border-top:0}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;border:0;background:none;text-align:left;color:var(--tx);cursor:pointer}
.box{width:22px;height:22px;border-radius:6px;border:2px solid #9aa8a4;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.done .box{background:var(--g2);border-color:var(--g2)}
.done .tt{color:var(--mu)}
.meta{font-size:12px;color:var(--mu)}
.arr{color:var(--g);font-weight:500}.arr.upd{color:#8a4b00}
.res.upd{color:#8a4b00}
.res{font-size:14px;color:var(--g);font-weight:500}
.urg{color:#b42318;font-weight:700}
.panel{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.inp{min-height:44px;padding:8px 12px;border:1px solid #cdd6d3;border-radius:8px;width:100%}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{min-height:42px;padding:0 14px;border-radius:8px;border:1px solid #cdd6d3;background:#fff;color:#3c4a46;cursor:pointer}
.b.p{background:var(--g2);border-color:var(--g2);color:#fff;font-weight:600;flex-grow:1}
.b.o{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.b.r{color:#b42318;border-color:#f1b5ae}
.flap{background:var(--orbg);border:1px solid var(--orln);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.flap .q{font-weight:700;color:#7a3d00}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qb{min-height:36px;padding:2px 12px;border-radius:999px;border:1px solid #f0cfa4;background:#fff;color:#7a3d00}
.qb.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:600}
.qb.stop.on{background:#6b7470;border-color:#6b7470}
.add{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde3e1;padding:10px 12px 16px;display:flex;gap:8px;z-index:5}
.add .b.p{flex-grow:0}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qrb{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid #a9d6cd;background:#eef8f6;color:#0b4d45;font-weight:500}
.undo{border:0;background:#fff;color:#17201d;border-radius:8px;min-height:36px;padding:0 12px;font-weight:600;margin-left:8px}
.row{transition:transform .15s}
.news{display:block;width:100%;text-align:left;border:0;background:#e6edff;color:#1e3a8a;font-weight:600;padding:10px 16px;font-size:14px;border-bottom:1px solid #c7d4fb}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.tag.new{background:#1d4ed8;color:#fff}.tag.res{background:#0f766e;color:#fff}
.isnew{background:#f5f8ff}
.toast{align-items:center;position:fixed;left:12px;right:12px;bottom:84px;background:#17201d;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;white-space:pre-line;display:none;z-index:9}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.busy{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="ttl">งานวันนี้</h1></div>
    <button class="pill" id="count" onclick="TAB==='round'?setTab('round'):load()" aria-label="รีเฟรช">…</button>
  </div>
  <div class="tabs"><button id="tabT" class="tab on" onclick="setTab('task')">งาน</button><button id="tabR" class="tab" onclick="setTab('round')">ราวด์</button></div>
  <div class="dnav" id="dnav"></div>
  <div class="chips" id="chips"></div>
</header>
<div id="notices"></div>
<main id="main"><div class="empty">กำลังโหลด…</div></main>
<div class="toast" id="toast"></div>
<form class="add" onsubmit="addTask(event)">
  <label for="newt" style="position:absolute;left:-9999px">เพิ่มงาน</label>
  <input class="inp" id="newt" placeholder="เพิ่มงาน เช่น สมชาย CBC" autocomplete="off">
  <button class="b p" type="submit">เพิ่ม</button>
</form>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw9dsYKGy8pELEBeIatNSjJLFv6W7MGjxhnjj584Z4BUlXN6WEfon-JID4f4eHR9wQ/exec';   // ← วาง URL ของบอท (ลงท้าย /exec)
const TOK = new URLSearchParams(location.search).get('t') || '';
const call = (q, ok) => fetch(API + '?' + new URLSearchParams(Object.assign({ t: TOK }, q))).then(r => r.json()).then(ok).catch(fail);
let OFF = 0, TAB = 'task', R = null, RBLD = 'ทั้งหมด', RG = 'ทุกคน', ROPEN = null, D = null, BLD = 'ทั้งหมด', OPEN = null, QEDIT = null, QDRAFT = null, ARM = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 🎨 สีหัวแอพตามสีประจำวัน (วันใหม่เริ่ม 06:00 เหมือนบอท)
const DAYCOL = ['#b42318', '#a16207', '#be185d', '#15803d', '#c2410c', '#1d4ed8', '#6d28d9'];   // อา จ อ พ พฤ ศ ส
(() => { const d = new Date(Date.now() + 7 * 3600e3 - 6 * 3600e3).getUTCDay(); document.documentElement.style.setProperty('--hd', DAYCOL[d]); document.querySelector('meta[name=theme-color]') || document.head.insertAdjacentHTML('beforeend', `<meta name="theme-color" content="${DAYCOL[d]}">`); })();
const short = b => String(b).replace(/^ตึก\s*/, '');

function load() {
  $('count').textContent = '…';
  call({ api: 'data', off: OFF }, set);
}
// 🆕 งาน/ผลใหม่ตั้งแต่เปิดแอพครั้งก่อน (จำในเครื่องนี้ ; ไม่นับที่ตัวเองทำ)
const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let SEEN = null, NEWS = { t: [], r: [] }, SEEN_NO = {};
const MINE = LS.get('ww_mine') || {};
function markMine(no) { if (OFF) return; MINE[D.day + '#' + no] = Date.now(); LS.set('ww_mine', MINE); }
function computeNews() {
  if (OFF !== 0 || !D) { NEWS = { t: [], r: [] }; return; }
  const key = 'ww_seen_' + D.day, prev = LS.get(key);
  if (SEEN === null) { SEEN = prev || D.now; LS.set(key, D.now); }   // ครั้งแรกของวัน = ไม่เตือน
  const mine = t => (MINE[D.day + '#' + t.no] || 0);
  const me = D.me || '\u0000';
  NEWS.t = D.tasks.filter(t => t.addTs > SEEN && t.by !== me && !mine(t));
  NEWS.r = D.tasks.filter(t => t.result && t.resTs > SEEN && t.resTs > mine(t) + 60e3 && !(t.done && t.doneBy === me));
}
const isNewT = t => NEWS.t.includes(t) && !SEEN_NO[t.no], isNewR = t => NEWS.r.includes(t) && !SEEN_NO[t.no];
function newsBar() {
  const nt = NEWS.t.filter(isNewT).length, nr = NEWS.r.filter(isNewR).length;
  if (!nt && !nr) return '';
  const at = new Date(SEEN + 7 * 3600e3).toISOString().slice(11, 16);
  return `<button class="news" onclick="jumpNew()">${nt ? '🆕 งานใหม่ ' + nt : ''}${nt && nr ? ' · ' : ''}${nr ? '📝 ผลใหม่ ' + nr : ''} <span style="font-weight:400">ตั้งแต่ ${at}</span> ›</button>`;
}
function jumpNew() { const el = document.querySelector('.isnew'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function set(d) {
  document.body.classList.remove('busy');
  if (!d || d.error) { $('main').innerHTML = '<div class="empty">🔒 ลิงก์หมดอายุ<br>พิมพ์ ww app ในแชท 1:1 กับบอท</div>'; return; }
  D = d; computeNews(); render();
}
function fail(e) { document.body.classList.remove('busy'); toast('❗ เชื่อมต่อไม่ได้ ลองใหม่'); }
// ✅ ปิดงานแบบรอ 5 วินาที (กดยกเลิกได้) แล้วค่อยส่งให้บอท
const QUICK = ['ปกติ', 'รอผล', 'ส่งแล้ว', 'ok'];
let HOLD = [];
function closeNo(no, res, off) {
  if (D) markMine(no);
  off = off == null ? OFF : off;
  const t = (off === OFF && D) ? T(no) : null, before = t ? Object.assign({}, t) : null;
  if (t) Object.assign(t, { done: true, result: res || '', doneBy: 'คุณ', doneAt: nowHM() });
  OPEN = null; if (TAB === 'task' && D) render();
  const day = off === OFF && D ? D.day : null;
  const job = { no, res, off, day, before, tm: setTimeout(() => sendClose(job), 5000) };
  HOLD.push(job);
  undoBar(`✅ ปิดงาน ${no}${res ? ' · ' + res : ''}`, job);
}
function sendClose(job) {
  HOLD = HOLD.filter(j => j !== job);
  const cmd = `ww ${job.off && job.day ? job.day + ' ' : ''}เสร็จ ${job.no} ${job.res || 'เสร็จ'}`;
  PENDING++; if (TAB === 'task' && D) render();
  call({ api: 'run', cmd, off: OFF }, r => { PENDING--; if (r.error) return set(r); if (/^❗/.test(r.msg || '')) toast(r.msg); if (!HOLD.length) set(r.data); if (TAB === 'round') setTab('round'); });
}
function undo(job) {
  clearTimeout(job.tm); HOLD = HOLD.filter(j => j !== job);
  if (job.before && D) { const t = T(job.no); if (t) Object.assign(t, job.before); render(); }
  $('toast').style.display = 'none';
}
function undoBar(m, job) {
  const t = $('toast'); t.innerHTML = `<span style="flex:1">${esc(m)}</span><button class="undo">↩️ ยกเลิก</button>`;
  t.querySelector('.undo').onclick = () => undo(job);
  t.style.display = 'flex'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 5000);
}
// ส่งงานที่รออยู่ทันทีถ้าปิด/สลับแอพ
const flush = () => HOLD.slice().forEach(j => { clearTimeout(j.tm); sendClose(j); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);
// แท็บราวด์: ปิดงานวันนี้
function closeRound(no, btn) { btn.textContent = '✓'; btn.disabled = true; closeNo(no, '', 0); }
// 👉 ปัดขวาที่งานค้าง = ปิดงาน (ไม่มีผล)
let SW = null;
document.addEventListener('touchstart', e => { const b = e.target.closest('[data-sw]'); SW = b ? { b, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0 } : null; }, { passive: true });
document.addEventListener('touchmove', e => { if (!SW) return; const dx = e.touches[0].clientX - SW.x, dy = e.touches[0].clientY - SW.y; if (Math.abs(dy) > Math.abs(dx)) { SW.b.style.transform = ''; SW = null; return; } SW.dx = Math.max(0, dx); SW.b.style.transform = `translateX(${SW.dx}px)`; SW.b.style.background = SW.dx > 90 ? '#dff3ee' : ''; }, { passive: true });
document.addEventListener('touchend', () => { if (!SW) return; const { b, dx } = SW; SW = null; b.style.transform = ''; b.style.background = ''; if (dx > 90) closeNo(Number(b.dataset.sw), ''); });
function toast(m) { if (!m) return; const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
// ⚡ ตอบสนองทันที: แก้บนจอก่อน (patch) แล้วค่อยส่งให้บอท ; ผลจากบอทมาทีหลังจะแทนข้อมูลบนจอ
let SEQ = 0, PENDING = 0;
function run(cmd, patch) {
  const mn = cmd.match(/^ww \S+ (\d+)/); if (mn && D) markMine(Number(mn[1]));
  OPEN = null; QEDIT = null; ARM = null;
  if (patch && D) { try { patch(); } catch (e) {} }
  const my = ++SEQ; PENDING++; render();
  call({ api: 'run', cmd: W(cmd), off: OFF }, r => {
    PENDING--;
    if (r.error) return set(r);
    if (/^❗/.test(r.msg || '')) toast(r.msg); else if (!patch) toast(r.msg);
    if (my === SEQ) set(r.data); else render();
  });
}
const nowHM = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(11, 16);

function setTab(t) {
  TAB = t; if (t === "round") $("ttl").textContent = "ราวด์"; $('tabT').classList.toggle('on', t === 'task'); $('tabR').classList.toggle('on', t === 'round');
  $('newt').parentNode.style.display = t === 'task' ? 'flex' : 'none'; $('dnav').style.display = t === 'task' ? 'flex' : 'none';
  if (t === 'round') { if (R) renderRound(); else { $('main').innerHTML = '<div class="empty">กำลังโหลด…</div>'; }
    call({ api: 'round' }, r => { if (r.error) { $('main').innerHTML = '<div class="empty">' + (r.error === 'expired' ? '🔒 ลิงก์หมดอายุ' : '❗ อ่านตารางราวด์ไม่ได้') + '</div>'; return; } R = r; if (TAB === 'round') renderRound(); }); }
  else if (D) render();
}
function renderRound() {
  const all = R.pts;
  const blds = ['ทั้งหมด', ...new Set(all.map(p => p.bld))];
  if (!blds.includes(RBLD)) RBLD = 'ทั้งหมด';
  $('chips').innerHTML = blds.map(b => `<button class="chip${b === RBLD ? ' on' : ''}" onclick="RBLD='${esc(b)}';renderRound()">${esc(short(b))}</button>`).join('');
  // 👥 ใครดูใคร: กลุ่มจาก Tags (ชื่อคน / ทุกวัน… / ว่าง)
  const cnt = {}; all.forEach(p => p.tags.forEach(g => cnt[g] = (cnt[g] || 0) + 1));
  const gs = Object.keys(cnt).sort((a, b) => (a === 'ว่าง' ? -1 : b === 'ว่าง' ? 1 : 0) || (/^ทุก/.test(a) - /^ทุก/.test(b)) || a.localeCompare(b));
  if (RG !== 'ทุกคน' && !cnt[RG]) RG = 'ทุกคน';
  $('notices').innerHTML = `<div class="gbar">${['ทุกคน', ...gs].map(g => `<button class="gchip${g === RG ? ' on' : ''}${g === 'ว่าง' ? ' warn' : ''}" onclick="RG='${esc(g)}';renderRound()">${g === 'ว่าง' ? '🔔 ' : ''}${esc(g)}${g === 'ทุกคน' ? '' : ' ' + cnt[g]}</button>`).join('')}</div>`;
  const ps = all.filter(p => (RBLD === 'ทั้งหมด' || p.bld === RBLD) && (RG === 'ทุกคน' || p.tags.includes(RG)));
  $('count').textContent = ps.length + ' คน';
  const wards = [...new Set(ps.map(p => p.ward))];
  $('main').innerHTML = wards.map(w => {
    const list = ps.filter(p => p.ward === w);
    return `<div><div class="sec">${esc(w)} · ${list.length} คน</div><div class="card">${list.map(p => {
      const i = all.indexOf(p), op = ROPEN === i;
      return `<div class="task"><button class="row" onclick="ROPEN=ROPEN===${i}?null:${i};renderRound()" style="align-items:flex-start">
        <span style="flex-grow:1;min-width:0"><div><b>${esc(p.name)}</b> <span class="hn">${p.hn ? 'HN ' + esc(p.hn) : ''}</span></div>
        <div style="font-size:13px">${esc(p.dx)}${p.staff ? ' · อ. ' + esc(p.staff) : ''}</div>
        <div class="who">${p.tags.includes('ว่าง') ? '<span class="nobody">🔔 ยังไม่มีคนดู</span>' : '👤 ' + esc(p.team || p.tags.join(', '))}${p.remark ? ' · ' + esc(p.remark) : ''}</div>
        ${p.ww ? `<div class="ww">📌 ${esc(p.ww)}</div>` : ''}</span>
        <span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">${p.open ? `<span class="badge">🟡 ค้าง ${p.open}</span>` : p.done ? '<span class="badge ok">✅ เสร็จหมด</span>' : ''}${p.flap ? '<span class="badge">👁 Flap</span>' : ''}</span></button>
        ${op ? `<div class="panel">${p.hist.length ? `<div class="hist">${p.hist.map(x => `<div><div class="meta">${esc(x.day)}</div><div style="display:flex;gap:8px;align-items:center"><span style="flex:1">${x.mark} ${esc(x.task)}${x.res ? ` <span class="${x.upd ? 'arr upd' : 'arr'}">→ ${esc(x.res)}</span>` : ''}</span>${x.canClose ? `<button class="b" style="min-height:34px;padding:0 10px" onclick="event.stopPropagation();closeRound(${x.no}, this)">✓ เสร็จ</button>` : ''}</div></div>`).join('')}</div>` : '<div class="meta">ไม่มีงานใน 3 วันล่าสุด</div>'}
          <div class="btns" style="flex-wrap:nowrap"><input class="inp" id="radd${i}" placeholder="งานของ${esc(p.name.split(/\s+/)[0])} เช่น CBC, K" style="flex:1;width:auto;min-width:0" onkeydown="if(event.key==='Enter')addR(${i})">
          <button class="b p" style="flex-grow:0" onclick="addR(${i})">เพิ่มงาน</button></div></div>` : ''}</div>`;
    }).join('')}</div></div>`;
  }).join('') || '<div class="empty">ไม่มีคนไข้ในตาราง</div>';
}
// เพิ่มงานจากหน้าราวด์ (ลงวันนี้) — ใส่ ward + ชื่อให้เอง กันชื่อซ้ำคนละ ward
function addR(i) {
  const p = R.pts[i], v = ($('radd' + i).value || '').trim();
  if (!v) return toast('พิมพ์งานก่อน เช่น CBC');
  const nm = p.name.split(/\s+/)[0], cmd = (/รอ\s*admit/i.test(p.ward) ? `ww ${nm} ${v}` : `ww ${p.ward} ${nm} ${v}`);
  document.body.classList.add('busy');
  call({ api: 'run', cmd, off: 0 }, r => { document.body.classList.remove('busy'); if (r.error) return set(r); toast(r.msg); if (OFF === 0) D = r.data; setTab('round'); });
}
function addFor(n) { setTab('task'); $('newt').value = n + ' '; $('newt').focus(); }
// วันอื่น: ใส่วันที่ในคำสั่ง (ww 22/10/69 เสร็จ 5 … / ww แก้ผล 22/10/69 5 …)
function W(cmd) {
  if (!OFF || !D) return cmd;
  const d = D.day, m = cmd.match(/^ww แก้ผล (\d+) ([\s\S]*)$/);
  return m ? `ww แก้ผล ${d} ${m[1]} ${m[2]}` : cmd.replace(/^ww /, `ww ${d} `);
}
function go(n) { OFF = n === 0 ? 0 : OFF + n; OPEN = null; QEDIT = null; load(); }
function render() {
  if (TAB === 'round') return;
  const names = { '-1': 'เมื่อวาน', '0': 'วันนี้', '1': 'พรุ่งนี้' };
  $('date').textContent = D.day;
  $('ttl').textContent = 'งาน' + (names[OFF] || (OFF < 0 ? ` ${-OFF} วันก่อน` : ` อีก ${OFF} วัน`));
  const rel = names[OFF] || (OFF < 0 ? `${-OFF} วันก่อน` : `อีก ${OFF} วัน`);
  $('dnav').innerHTML = `<button class="dn" onclick="go(-1)" aria-label="วันก่อน">‹</button><button class="dn mid${OFF ? '' : ' on'}" disabled>${D.day} (${rel})</button><button class="dn" onclick="go(1)" aria-label="วันถัดไป">›</button>${OFF ? '<button class="dn today" onclick="go(0)">วันนี้</button>' : ''}`;
  $('newt').placeholder = OFF ? `เพิ่มงานวันที่ ${D.day}` : 'เพิ่มงาน เช่น สมชาย CBC';
  const all = D.tasks;
  $('count').textContent = (PENDING ? '⏳ ' : '') + 'ค้าง ' + all.filter(t => !t.done && !t.flap).length;
  const blds = ['ทั้งหมด', ...new Set(all.map(t => t.bld))];
  if (!blds.includes(BLD)) BLD = 'ทั้งหมด';
  $('chips').innerHTML = blds.map(b => `<button class="chip${b === BLD ? ' on' : ''}" onclick="BLD='${esc(b)}';render()">${esc(short(b))}</button>`).join('');
  $('notices').innerHTML = newsBar() + (D.notices.length ? `<div class="notice">📢 ${D.notices.map(esc).join(' · ')}</div>` : '');
  const ts = all.filter(t => BLD === 'ทั้งหมด' || t.bld === BLD);
  let h = '';
  const fl = ts.filter(t => t.flap && !t.done);
  if (fl.length) h += '<div><div class="sec">Flap</div><div style="display:flex;flex-direction:column;gap:8px">' + fl.map(flapCard).join('') + '</div></div>';
  const open = ts.filter(t => !t.flap && !t.done);
  if (open.length) h += '<div><div class="sec">งานค้าง (' + open.length + ')</div><div style="display:flex;flex-direction:column;gap:8px">' + byPatient(open) + '</div></div>';
  const done = ts.filter(t => t.done);
  if (done.length) h += '<div><div class="sec">เสร็จแล้ว (' + done.length + ')</div><div style="display:flex;flex-direction:column;gap:8px">' + byPatient(done) + '</div></div>';
  $('main').innerHTML = h || '<div class="empty">ไม่มีงาน 🎉</div>';
}

function byPatient(list) {
  const groups = [];
  list.forEach(t => { const k = t.pt + '|' + t.ward; let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, pt: t.pt, ward: t.ward, items: [] }); g.items.push(t); });
  return groups.map(g => `<div class="card"><div class="pthead">${esc(g.pt)}<span>${esc(g.ward)}</span></div>${g.items.map(taskRow).join('')}</div>`).join('');
}
function taskRow(t) {
  const isOpen = OPEN === t.no;
  const nw = isNewT(t) ? '<span class="tag new">ใหม่</span>' : isNewR(t) ? '<span class="tag res">ผลใหม่</span>' : '';
  let h = `<div class="task${t.done ? ' done' : ''}${nw ? ' isnew' : ''}"><button class="row" onclick="toggle(${t.no})" ${t.done ? '' : `data-sw="${t.no}"`}>
    <span class="box">${t.done ? '✓' : ''}</span>
    <span style="flex-grow:1;min-width:0"><div class="tt">${nw}${t.urgent ? '<span class="urg">ด่วน </span>' : ''}${esc(t.rest || t.task)}</div>
    ${t.result ? `<div class="res${t.done ? '' : ' upd'}">→ ${esc(t.result)}</div>` : ''}
    <div class="meta">${t.no}. ${t.done ? 'ปิดโดย ' + esc(t.doneBy) + ' ' + esc(t.doneAt) : 'ลงโดย ' + esc(t.by)}</div></span></button>`;
  if (isOpen && !t.done) h += `<div class="panel">
    <div class="qr">${QUICK.map(q => `<button class="qrb" onclick="closeNo(${t.no}, '${q}')">${q}</button>`).join('')}</div>
    <input class="inp" id="res${t.no}" placeholder="ผล (ไม่ใส่ก็ได้) เช่น K 3.8">
    <div class="btns">
      <button class="b p" onclick="closeT(${t.no})">ปิดงาน</button>
      <button class="b" onclick="upd(${t.no})">อัปเดต (ยังไม่ปิด)</button>
    </div>
    <div class="btns">
      <button class="b" onclick="editT(${t.no})">แก้ข้อความ</button>
      <button class="b r" onclick="cancelT(${t.no})">${ARM === 'c' + t.no ? 'กดอีกครั้งเพื่อยกเลิก' : 'ยกเลิกงาน'}</button>
      <button class="b" onclick="OPEN=null;render()">ปิดเมนู</button>
    </div></div>`;
  if (isOpen && t.done) h += `<div class="panel">
    <input class="inp" id="res${t.no}" placeholder="${t.result ? 'พิมพ์ผล' : 'เพิ่มผล เช่น Hb 10'}">
    <div class="btns">
      <button class="b p" onclick="addRes(${t.no})">เพิ่มผล</button>
      ${t.result ? `<button class="b" onclick="fixRes(${t.no})">แทนผลล่าสุด</button>` : ''}
      <button class="b" onclick="run('ww เปิด ${t.no}', () => Object.assign(T(${t.no}), { done: false }))">เปิดงานใหม่</button>
      <button class="b" onclick="OPEN=null;render()">ปิดเมนู</button>
    </div></div>`;
  return h + '</div>';
}
function flapCard(t) {
  const ed = QEDIT === t.no, cur = QDRAFT;
  let h = `<div class="flap"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(t.pt)}</b> <span class="q">${t.q ? 'q ' + t.q + ' hr' : 'เฝ้า'}</span></div><span class="meta">${esc(t.ward)}</span></div>
    <div style="font-size:14px">${esc(t.rest)}</div>`;
  if (ed) h += `<div class="meta" style="color:#7a3d00">เลือกความถี่ใหม่ แล้วกดยืนยัน</div><div class="qs">
    ${[2, 4, 6, 8].map(n => `<button class="qb${cur === n ? ' on' : ''}" onclick="QDRAFT=${n};render()">q ${n}</button>`).join('')}
    <button class="qb stop${cur === 'stop' ? ' on' : ''}" onclick="QDRAFT='stop';render()">หยุดเฝ้า</button></div>
    <div class="btns"><button class="b o" onclick="saveQ(${t.no})">ยืนยัน</button><button class="b" onclick="QEDIT=null;render()">ยกเลิก</button></div>`;
  else h += `<div style="display:flex;justify-content:space-between;align-items:center"><span class="meta">${t.no}. ลงโดย ${esc(t.by)}</span><button class="b" style="min-height:34px" onclick="QEDIT=${t.no};QDRAFT=${t.q || 'null'};render()">แก้ความถี่</button></div>`;
  return h + '</div>';
}

const T = no => D.tasks.find(t => t.no === no);
const val = no => ($('res' + no) || {}).value ? $('res' + no).value.trim() : '';
function toggle(no) { SEEN_NO[no] = 1;  OPEN = OPEN === no ? null : no; ARM = null; render(); const i = $('res' + no); if (i) i.focus(); }
function closeT(no) { closeNo(no, val(no)); }
function upd(no) { const v = val(no); if (!v) return toast('พิมพ์ความคืบหน้าในช่องก่อน'); run(`ww update ${no} ${v}`, () => T(no).result = v); }
function editT(no) { const v = val(no); if (!v) return toast('พิมพ์ข้อความใหม่ในช่องก่อน แล้วกดแก้ข้อความ'); run(`ww แก้ ${no} ${v}`, () => T(no).rest = v); }
function cancelT(no) { if (ARM !== 'c' + no) { ARM = 'c' + no; return render(); } run(`ww ยกเลิก ${no}`, () => D.tasks = D.tasks.filter(t => t.no !== no)); }
function addRes(no) { const v = val(no); if (!v) return toast('พิมพ์ผลก่อน'); run(`ww เสร็จ ${no} ${v}`, () => T(no).result = v); }
function fixRes(no) { const v = val(no); if (!v) return toast('พิมพ์ผลก่อน'); run(`ww แก้ผล ${no} ${v}`, () => T(no).result = v); }
function saveQ(no) {
  const t = T(no);
  if (QDRAFT === 'stop') return run(`ww เสร็จ ${no} หยุดเฝ้า`, () => T(no).done = true);
  if (!QDRAFT || QDRAFT === t.q) { QEDIT = null; return render(); }
  const re = /q\s*\d+\s*(?:hrs?|ชม\.?|h)?/i;
  const nq = QDRAFT; run(`ww แก้ ${no} ${re.test(t.task) ? t.task.replace(re, 'q ' + QDRAFT + ' hr') : t.task + ' q ' + QDRAFT + ' hr'}`, () => T(no).q = nq);
}
function addTask(e) { e.preventDefault(); const v = $('newt').value.trim(); if (!v) return; $('newt').value = ''; run('ww ' + v); }
load();
</script>
