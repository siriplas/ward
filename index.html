<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>งานวันนี้</title>
<style>
:root{--hd:#1d4ed8;--bg:#fff;--bg2:#f4f5f7;--tx:#111827;--tx2:#374151;--mu:#6b7280;--ln:#eceef1;--g:#059669;--g2:#059669;--or:#d97706;--orbg:#fff7ed;--orx:#9a3412;--rd:#dc2626;--bl:#1e40af;--card:#fff;--inv:#111827;--invt:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--bg2:#1c1f26;--tx:#e5e7eb;--tx2:#d1d5db;--mu:#9ca3af;--ln:#262a31;--g:#34d399;--g2:#10b981;--or:#fbbf24;--orbg:#2a1d10;--orx:#fdba74;--rd:#f87171;--bl:#93c5fd;--card:#161a20;--inv:#e5e7eb;--invt:#0f1115}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:15px;color:inherit}
header{background:var(--bg);border-top:4px solid var(--hd);padding:12px 16px 0;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top>div{display:flex;align-items:baseline;gap:8px;flex-direction:row-reverse}
.date{font-size:13px;color:var(--mu)}
h1{margin:0;font-size:20px;font-weight:700}
.pill{background:none;border:0;color:var(--mu);font-size:13px;padding:4px 0;white-space:nowrap}
.pill:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-right:6px}
.rf{width:36px;height:36px;border:0;border-radius:50%;background:var(--bg2);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.rf svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:20px;margin-top:6px}
.tab{border:0;background:none;padding:8px 0;color:var(--mu);font-weight:500;border-bottom:2px solid transparent;min-height:38px}
.tab.on{color:var(--tx);border-bottom-color:var(--hd)}
.dnav{display:flex;gap:6px;align-items:center;padding:8px 0 0}
.dn{min-height:32px;min-width:36px;border:0;border-radius:8px;background:var(--bg2);color:var(--tx);font-size:16px}
.dn.mid{flex:1;font-size:13px;color:var(--tx2);background:var(--bg2)}
.dn.today{font-size:13px;padding:0 12px;background:var(--inv);color:var(--invt);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chip{flex-shrink:0;min-height:30px;padding:2px 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-size:13px}
.chip.on{background:var(--inv);color:var(--invt);font-weight:600}
.ww{font-size:13px;color:var(--bl);margin-top:3px}
.gbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.gchip{flex-shrink:0;min-height:30px;padding:2px 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-size:13px}
.gchip.on{background:var(--inv);color:var(--invt);font-weight:600}
.gchip.warn{color:var(--rd)}.gchip.warn.on{background:var(--rd);color:#fff}
.who{font-size:12px;color:var(--mu);margin-top:2px}.nobody{color:var(--rd);font-weight:500}
.hn{font-weight:400;font-size:13px;color:var(--mu);margin-left:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mu);flex-shrink:0;white-space:nowrap}
.badge:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--or)}
.badge.ok{color:var(--g)}.badge.ok:before{display:none}
.badge.fl:before{background:var(--orx)}
.hist{border-left:2px solid var(--ln);padding-left:10px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.notice{padding:8px 16px;font-size:13px;color:var(--or)}
main{padding:4px 0 120px;display:flex;flex-direction:column;gap:4px}
.sec{font-size:12px;font-weight:600;color:var(--mu);padding:12px 16px 2px;letter-spacing:.3px}
.card{background:transparent}
.pthead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px 0;font-weight:700;font-size:16px}
.pthead span{font-weight:400;font-size:12px;color:var(--mu)}
.task{}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:44px;padding:7px 16px;border:0;background:none;text-align:left;color:var(--tx);cursor:pointer;transition:transform .15s}
.box{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--mu);opacity:.7;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.done .box{background:var(--g2);border-color:var(--g2);opacity:1}
.done .tt{color:var(--mu)}
.meta{font-size:12px;color:var(--mu);margin-top:2px}
.arr{color:var(--g)}.arr.upd{color:var(--or)}
.res{font-size:13px;color:var(--g)}.res.upd{color:var(--or)}
.urg{color:var(--rd);font-weight:600;font-size:13px;margin-right:4px}
.panel{padding:4px 16px 12px 48px;display:flex;flex-direction:column;gap:8px}
.inp{min-height:42px;padding:8px 12px;border:1px solid var(--ln);background:var(--bg2);border-radius:10px;width:100%;color:var(--tx)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--bg2);color:var(--tx2);cursor:pointer;font-size:14px}
.b.p{background:var(--hd);color:#fff;font-weight:600;flex-grow:1}
.b.o{background:var(--or);color:#fff;font-weight:600}
.b.r{color:var(--rd)}
.flap{margin:4px 16px;background:var(--orbg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.flap .q{font-weight:700;color:var(--orx)}
.flap .b{background:transparent;min-height:32px;padding:0 4px;color:var(--mu)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qb{min-height:34px;padding:2px 12px;border-radius:999px;border:0;background:var(--card);color:var(--orx)}
.qb.on{background:var(--or);color:#fff;font-weight:600}
.qb.stop.on{background:var(--mu);color:#fff}
.add{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:10px 12px 16px;display:none;gap:8px;z-index:6}
body.adding .add{display:flex}.rtab .fab{display:none}body.adding .fab{display:none}
.add .b.p{flex-grow:0}
.fab{position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;background:var(--hd);color:#fff;font-size:28px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qrb{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--g);font-size:14px}
.undo{border:0;background:var(--invt);color:var(--inv);border-radius:8px;min-height:34px;padding:0 12px;font-weight:600;margin-left:8px}
.news{display:block;width:100%;text-align:left;border:0;background:var(--bg2);color:var(--bl);font-weight:600;padding:9px 16px;font-size:13px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag.new{background:var(--hd);color:#fff}.tag.res{background:var(--g2);color:#fff}
.isnew .tt{font-weight:500}
.links{display:flex;gap:18px;margin-top:6px}.links a,.links button{background:none;border:0;padding:4px 0;color:var(--mu);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:4px;cursor:pointer}
.links svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prow{border-bottom:1px solid var(--ln)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sbox{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.sbox h3{margin:0;font-size:18px}.lbl{font-size:12px;font-weight:600;color:var(--mu)}
.chip2{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--tx2)}
.chip2.on{background:var(--inv);color:var(--invt);font-weight:600}
.prog{font-size:14px;white-space:pre-line}
.toast{align-items:center;position:fixed;left:12px;right:12px;bottom:90px;background:var(--inv);color:var(--invt);border-radius:12px;padding:10px 14px;font-size:14px;white-space:pre-line;display:none;z-index:9}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.busy{opacity:.5;pointer-events:none}
input[type=date]{color-scheme:light dark}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="ttl">งานวันนี้</h1></div>
    <span style="display:flex;align-items:center;gap:6px"><span class="pill" id="count">…</span><button class="rf" id="rf" onclick="refreshNow()" aria-label="รีเฟรช"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></span>
  </div>
  <div class="tabs"><button id="tabT" class="tab on" onclick="setTab('task')">งาน</button><button id="tabR" class="tab" onclick="setTab('round')">ราวด์</button></div>
  <div class="dnav" id="dnav"></div>
  <div class="chips" id="chips"></div>
</header>
<div id="notices"></div>
<main id="main"><div class="empty">กำลังโหลด…</div></main>
<div class="toast" id="toast"></div>
<div class="sheet" id="psheet" style="display:none" onclick="if(event.target===this)closePhoto()"><div class="sbox" id="pbox"></div></div>
<form class="add" onsubmit="addTask(event)">
  <label for="newt" style="position:absolute;left:-9999px">เพิ่มงาน</label>
  <input class="inp" id="newt" placeholder="เพิ่มงาน เช่น สมชาย CBC" autocomplete="off">
  <button class="b p" type="submit">เพิ่ม</button>
  <button class="b" type="button" onclick="document.body.classList.remove('adding')" aria-label="ปิด">✕</button>
</form>
<button class="fab" id="fab" aria-label="เพิ่มงาน" onclick="document.body.classList.add('adding');$('newt').focus()">+</button>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw9dsYKGy8pELEBeIatNSjJLFv6W7MGjxhnjj584Z4BUlXN6WEfon-JID4f4eHR9wQ/exec';   // ← วาง URL ของบอท (ลงท้าย /exec)
const TOK = new URLSearchParams(location.search).get('t') || '';
const call = (q, ok) => fetch(API + '?' + new URLSearchParams(Object.assign({ t: TOK }, q))).then(r => r.json()).then(ok).catch(fail);
let OFF = 0, TAB = 'task', R = null, RBLD = 'ทั้งหมด', RG = 'ทุกคน', ROPEN = null, D = null, BLD = 'ทั้งหมด', OPEN = null, QEDIT = null, QDRAFT = null, ARM = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 🎨 สีหัวแอพตามสีประจำวัน (วันใหม่เริ่ม 06:00 เหมือนบอท)
const DAYCOL = ['#b42318', '#a16207', '#be185d', '#15803d', '#c2410c', '#1d4ed8', '#6d28d9'];   // อา จ อ พ พฤ ศ ส
(() => { const d = new Date(Date.now() + 7 * 3600e3 - 6 * 3600e3).getUTCDay(); document.documentElement.style.setProperty('--hd', DAYCOL[d]); document.querySelector('meta[name=theme-color]') || document.head.insertAdjacentHTML('beforeend', `<meta name="theme-color" content="${DAYCOL[d]}">`); })();
const short = b => String(b).replace(/^ตึก\s*/, '');

function load() {
  $('count').textContent = '…';
  call({ api: 'data', off: OFF }, set);
}
// 🆕 งาน/ผลใหม่ตั้งแต่เปิดแอพครั้งก่อน (จำในเครื่องนี้ ; ไม่นับที่ตัวเองทำ)
const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let SEEN = null, NEWS = { t: [], r: [] }, SEEN_NO = {};
const MINE = LS.get('ww_mine') || {};
function markMine(no) { if (OFF) return; MINE[D.day + '#' + no] = Date.now(); LS.set('ww_mine', MINE); }
function computeNews() {
  if (OFF !== 0 || !D) { NEWS = { t: [], r: [] }; return; }
  const key = 'ww_seen_' + D.day, prev = LS.get(key);
  if (SEEN === null) { SEEN = prev || D.now; LS.set(key, D.now); }   // ครั้งแรกของวัน = ไม่เตือน
  const mine = t => (MINE[D.day + '#' + t.no] || 0);
  const me = D.me || '\u0000';
  NEWS.t = D.tasks.filter(t => t.addTs > SEEN && t.by !== me && !mine(t));
  NEWS.r = D.tasks.filter(t => t.result && t.resTs > SEEN && t.resTs > mine(t) + 60e3 && !(t.done && t.doneBy === me));
}
const isNewT = t => NEWS.t.includes(t) && !SEEN_NO[t.no], isNewR = t => NEWS.r.includes(t) && !SEEN_NO[t.no];
function newsBar() {
  const nt = NEWS.t.filter(isNewT).length, nr = NEWS.r.filter(isNewR).length;
  if (!nt && !nr) return '';
  const at = new Date(SEEN + 7 * 3600e3).toISOString().slice(11, 16);
  return `<button class="news" onclick="jumpNew()">${nt ? '🆕 งานใหม่ ' + nt : ''}${nt && nr ? ' · ' : ''}${nr ? '📝 ผลใหม่ ' + nr : ''} <span style="font-weight:400">ตั้งแต่ ${at}</span> ›</button>`;
}
function jumpNew() { const el = document.querySelector('.isnew'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function set(d) {
  document.body.classList.remove('busy');
  if (!d || d.error) { $('main').innerHTML = '<div class="empty">🔒 ลิงก์หมดอายุ<br>พิมพ์ ww app ในแชท 1:1 กับบอท</div>'; return; }
  D = d; computeNews(); render();
}
function fail(e) { document.body.classList.remove('busy'); toast('❗ เชื่อมต่อไม่ได้ ลองใหม่'); }
// ✅ ปิดงานแบบรอ 5 วินาที (กดยกเลิกได้) แล้วค่อยส่งให้บอท
const QUICK = ['ปกติ', 'รอผล', 'ส่งแล้ว', 'ok'];
let HOLD = [];
function closeNo(no, res, off) {
  if (D) markMine(no);
  off = off == null ? OFF : off;
  const t = (off === OFF && D) ? T(no) : null, before = t ? Object.assign({}, t) : null;
  if (t) Object.assign(t, { done: true, result: res || '', doneBy: 'คุณ', doneAt: nowHM() });
  OPEN = null; if (TAB === 'task' && D) render();
  const day = off === OFF && D ? D.day : null;
  const job = { no, res, off, day, before, tm: setTimeout(() => sendClose(job), 5000) };
  HOLD.push(job);
  undoBar(`✅ ปิดงาน ${no}${res ? ' · ' + res : ''}`, job);
}
function sendClose(job) {
  HOLD = HOLD.filter(j => j !== job);
  const cmd = `ww ${job.off && job.day ? job.day + ' ' : ''}เสร็จ ${job.no} ${job.res || 'เสร็จ'}`;
  PENDING++; if (TAB === 'task' && D) render();
  call({ api: 'run', cmd, off: OFF }, r => { PENDING--; if (r.error) return set(r); if (/^❗/.test(r.msg || '')) toast(r.msg); if (!HOLD.length) set(r.data); if (TAB === 'round') setTab('round'); });
}
function undo(job) {
  clearTimeout(job.tm); HOLD = HOLD.filter(j => j !== job);
  if (job.before && D) { const t = T(job.no); if (t) Object.assign(t, job.before); render(); }
  $('toast').style.display = 'none';
}
function undoBar(m, job) {
  const t = $('toast'); t.innerHTML = `<span style="flex:1">${esc(m)}</span><button class="undo">↩️ ยกเลิก</button>`;
  t.querySelector('.undo').onclick = () => undo(job);
  t.style.display = 'flex'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 5000);
}
// ส่งงานที่รออยู่ทันทีถ้าปิด/สลับแอพ
const flush = () => HOLD.slice().forEach(j => { clearTimeout(j.tm); sendClose(j); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);
// แท็บราวด์: ปิดงานวันนี้
function closeRound(no, btn) { btn.textContent = '✓'; btn.disabled = true; closeNo(no, '', 0); }
// 👉 ปัดขวาที่งานค้าง = ปิดงาน (ไม่มีผล)
let SW = null;
document.addEventListener('touchstart', e => { const b = e.target.closest('[data-sw]'); SW = b ? { b, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0 } : null; }, { passive: true });
document.addEventListener('touchmove', e => { if (!SW) return; const dx = e.touches[0].clientX - SW.x, dy = e.touches[0].clientY - SW.y; if (Math.abs(dy) > Math.abs(dx)) { SW.b.style.transform = ''; SW = null; return; } SW.dx = Math.max(0, dx); SW.b.style.transform = `translateX(${SW.dx}px)`; SW.b.style.background = SW.dx > 90 ? '#dff3ee' : ''; }, { passive: true });
document.addEventListener('touchend', () => { if (!SW) return; const { b, dx } = SW; SW = null; b.style.transform = ''; b.style.background = ''; if (dx > 90) closeNo(Number(b.dataset.sw), ''); });
function toast(m) { if (!m) return; const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
// ⚡ ตอบสนองทันที: แก้บนจอก่อน (patch) แล้วค่อยส่งให้บอท ; ผลจากบอทมาทีหลังจะแทนข้อมูลบนจอ
let SEQ = 0, PENDING = 0;
function run(cmd, patch) {
  const mn = cmd.match(/^ww \S+ (\d+)/); if (mn && D) markMine(Number(mn[1]));
  OPEN = null; QEDIT = null; ARM = null;
  if (patch && D) { try { patch(); } catch (e) {} }
  const my = ++SEQ; PENDING++; render();
  call({ api: 'run', cmd: W(cmd), off: OFF }, r => {
    PENDING--;
    if (r.error) return set(r);
    if (/^❗/.test(r.msg || '')) toast(r.msg); else if (!patch) toast(r.msg);
    if (my === SEQ) set(r.data); else render();
  });
}
const nowHM = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(11, 16);

function setTab(t) {
  TAB = t; document.body.classList.toggle('rtab', t === 'round'); if (t === "round") $("ttl").textContent = "ราวด์"; $('tabT').classList.toggle('on', t === 'task'); $('tabR').classList.toggle('on', t === 'round');
  $('newt').parentNode.style.display = t === 'task' ? 'flex' : 'none'; $('dnav').style.display = t === 'task' ? 'flex' : 'none';
  if (t === 'round') { if (R) renderRound(); else { $('main').innerHTML = '<div class="empty">กำลังโหลด…</div>'; }
    call({ api: 'round' }, r => { if (r.error) { $('main').innerHTML = '<div class="empty">' + (r.error === 'expired' ? '🔒 ลิงก์หมดอายุ' : '❗ อ่านตารางราวด์ไม่ได้') + '</div>'; return; } R = r; if (TAB === 'round') renderRound(); }); }
  else if (D) render();
}
function renderRound() {
  const all = R.pts;
  const blds = ['ทั้งหมด', ...new Set(all.map(p => p.bld))];
  if (!blds.includes(RBLD)) RBLD = 'ทั้งหมด';
  $('chips').innerHTML = blds.map(b => `<button class="chip${b === RBLD ? ' on' : ''}" onclick="RBLD='${esc(b)}';renderRound()">${esc(short(b))}</button>`).join('');
  // 👥 ใครดูใคร: กลุ่มจาก Tags (ชื่อคน / ทุกวัน… / ว่าง)
  const cnt = {}; all.forEach(p => p.tags.forEach(g => cnt[g] = (cnt[g] || 0) + 1));
  const gs = Object.keys(cnt).sort((a, b) => (a === 'ว่าง' ? -1 : b === 'ว่าง' ? 1 : 0) || (/^ทุก/.test(a) - /^ทุก/.test(b)) || a.localeCompare(b));
  if (RG !== 'ทุกคน' && !cnt[RG]) RG = 'ทุกคน';
  $('notices').innerHTML = `<div class="gbar">${['ทุกคน', ...gs].map(g => `<button class="gchip${g === RG ? ' on' : ''}${g === 'ว่าง' ? ' warn' : ''}" onclick="RG='${esc(g)}';renderRound()">${esc(g)}${g === 'ทุกคน' ? '' : ' ' + cnt[g]}</button>`).join('')}</div>`;

  $('main').innerHTML = wards.map(w => {
    const list = ps.filter(p => p.ward === w);
    return `<div><div class="sec">${esc(w)} · ${list.length} คน</div><div class="card">${list.map(p => {
      const i = all.indexOf(p), op = ROPEN === i;
      return `<div class="task prow"><button class="row" onclick="ROPEN=ROPEN===${i}?null:${i};renderRound()" style="align-items:flex-start">

          <div class="btns" style="flex-wrap:nowrap"><input class="inp" id="radd${i}" placeholder="งาน เช่น CBC" style="flex:1;width:auto;min-width:0" onkeydown="if(event.key==='Enter')addR(${i})">
          <button class="b p" style="flex-grow:0" onclick="addR(${i})">เพิ่ม</button></div></div>` : ''}</div>`;

}
// เพิ่มงานจากหน้าราวด์ (ลงวันนี้) — ใส่ ward + ชื่อให้เอง กันชื่อซ้ำคนละ ward
function addR(i) {
  const p = R.pts[i], v = ($('radd' + i).value || '').trim();
  if (!v) return toast('พิมพ์งานก่อน เช่น CBC');
  const nm = p.name.split(/\s+/)[0], cmd = (/รอ\s*admit/i.test(p.ward) ? `ww ${nm} ${v}` : `ww ${p.ward} ${nm} ${v}`);
  document.body.classList.add('busy');
  call({ api: 'run', cmd, off: 0 }, r => { document.body.classList.remove('busy'); if (r.error) return set(r); toast(r.msg); if (OFF === 0) D = r.data; setTab('round'); });
}
// 📷 ลงรูปจากแอพ → Drive (ทีละไฟล์)
let PH = null;
function openPhoto(i) {
  const p = R.pts[i];
  if (!p.hn) return toast(`ไม่มี HN ของ ${p.name} ในตาราง — เติม HN ในตารางก่อน หรือลงผ่านไลน์`);
  PH = { p, day: 0, date: isoOff(0), tag: '', pod: '', orig: false, files: [], busy: false, log: '' };
  $('psheet').style.display = 'flex'; drawPhoto();
}
function closePhoto() { if (PH && PH.busy) return; $('psheet').style.display = 'none'; PH = null; }
function drawPhoto() {
  const s = PH, tags = ['', 'preop', 'intraop', 'postop', 'POD', 'consult', 'opd'];
  $('pbox').innerHTML = `<h3>📷 ลงรูป ${esc(s.p.name)}</h3>
    <div class="meta">${esc(s.p.ward)} · ${esc(s.p.dx)}${s.p.staff ? ' · อ. ' + esc(s.p.staff) : ''}</div>
    <div class="lbl">รูปของวันไหน</div>
    <div class="btns">${[['วันนี้', 0], ['เมื่อวาน', -1]].map(([n, o]) => `<button class="chip2${s.date === isoOff(o) ? ' on' : ''}" onclick="PH.date='${isoOff(o)}';drawPhoto()">${n}</button>`).join('')}
      <input type="date" class="inp" style="width:auto;min-height:36px" value="${s.date}" max="${isoOff(0)}" onchange="PH.date=this.value;drawPhoto()"></div>
    <div class="lbl">ป้าย</div>
    <div class="btns">${tags.map(t => `<button class="chip2${s.tag === t ? ' on' : ''}" onclick="PH.tag='${t}';drawPhoto()">${t || 'ไม่ใส่'}</button>`).join('')}
      ${s.tag === 'POD' ? `<input class="inp" style="width:80px;min-height:36px" inputmode="numeric" placeholder="วันที่" value="${esc(s.pod)}" oninput="PH.pod=this.value.replace(/\\D/g,'')">` : ''}</div>
    <label class="btns" style="align-items:center;gap:8px"><input type="checkbox" ${s.orig ? 'checked' : ''} onchange="PH.orig=this.checked"> ส่งไฟล์ต้นฉบับ (คมสุด แต่ช้า)</label>
    <label class="b" style="display:flex;align-items:center;justify-content:center;cursor:pointer">🖼 เลือกรูป / วิดีโอ${s.files.length ? ` (${s.files.length})` : ''}<input type="file" accept="image/*,video/*" multiple style="display:none" onchange="PH.files=[...this.files];drawPhoto()"></label>
    ${s.log ? `<div class="prog">${esc(s.log)}</div>` : ''}
    <div class="btns"><button class="b p" ${s.busy || !s.files.length ? 'disabled' : ''} onclick="upPhotos()">${s.busy ? 'กำลังลง…' : 'ลง ' + s.files.length + ' ไฟล์'}</button><button class="b" onclick="closePhoto()">ปิด</button></div>`;
}
async function shrink(file) {
  if (PH.orig || !/^image\//.test(file.type) || /gif/.test(file.type)) return file;
  try {
    const bm = await createImageBitmap(file), M = 2500, k = Math.min(1, M / Math.max(bm.width, bm.height));
    if (k === 1 && file.size < 2.5e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.9));
  } catch (e) { return file; }
}
const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function upPhotos() {
  const s = PH; if (!s || s.busy) return;
  const tag = s.tag === 'POD' ? (s.pod ? 'POD' + s.pod : '') : s.tag;
  if (s.tag === 'POD' && !s.pod) return toast('ใส่เลข POD ก่อน');
  s.busy = true; let ok = 0, dup = 0, bad = 0, where = '', msgs = []; drawPhoto();
  for (let k = 0; k < s.files.length; k++) {
    s.log = `⏳ ${k + 1}/${s.files.length}…`; drawPhoto();
    try {
      const f = await shrink(s.files[k]);
      if (f.size > 35e6) { bad++; msgs.push(`${s.files[k].name}: ไฟล์ใหญ่เกิน 35 MB`); continue; }
      const body = { app: 'upload', t: TOK, name: s.p.name, hn: s.p.hn, dx: s.p.dx, staff: s.p.staffRaw || s.p.staff, day: s.date, tag, i: k + 1, first: k === 0, mime: f.type || 'image/jpeg', data: await b64(f) };
      const r = await (await fetch(API, { method: 'POST', body: JSON.stringify(body) })).json();
      if (r.ok) { r.dup ? dup++ : ok++; where = r.folder; if (r.renamed) msgs.push('📁 อัปเดตชื่อโฟลเดอร์: + ' + r.renamed); if (r.created) msgs.push('📁 สร้างโฟลเดอร์ใหม่'); }
      else { bad++; msgs.push(r.msg || (r.error === 'expired' ? 'ลิงก์หมดอายุ' : 'ลงไม่สำเร็จ')); if (r.error === 'expired') break; }
    } catch (e) { bad++; msgs.push('เชื่อมต่อไม่ได้'); }
  }
  s.busy = false; s.files = [];
  s.log = `✅ ลงแล้ว ${ok}${dup ? ' · มีแล้ว ' + dup + ' ข้าม' : ''}${bad ? ' · ไม่สำเร็จ ' + bad : ''}${where ? '\n📁 ' + where : ''}${msgs.length ? '\n' + [...new Set(msgs)].join('\n') : ''}`;
  drawPhoto();
}
function addFor(n) { setTab('task'); document.body.classList.add('adding'); $('newt').value = n + ' '; $('newt').focus(); }
// วันอื่น: ใส่วันที่ในคำสั่ง (ww 22/10/69 เสร็จ 5 … / ww แก้ผล 22/10/69 5 …)
function W(cmd) {
  if (!OFF || !D) return cmd;
  const d = D.day, m = cmd.match(/^ww แก้ผล (\d+) ([\s\S]*)$/);
  return m ? `ww แก้ผล ${d} ${m[1]} ${m[2]}` : cmd.replace(/^ww /, `ww ${d} `);
}
// 📅 ปฏิทิน: วันนี้ (เริ่ม 06:00) ± n วัน เป็น yyyy-mm-dd
const todayUTC = () => { const d = new Date(Date.now() + 7 * 3600e3 - 6 * 3600e3); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const isoOff = n => new Date(todayUTC() + n * 864e5).toISOString().slice(0, 10);
function pickDay(v) { if (!v) return; const [y, m, d] = v.split('-').map(Number); const n = Math.round((Date.UTC(y, m - 1, d) - todayUTC()) / 864e5); OFF = Math.max(-30, Math.min(14, n)); OPEN = null; QEDIT = null; load(); }
function refreshNow() { $('rf').classList.add('spin'); setTimeout(() => $('rf').classList.remove('spin'), 1500); TAB === 'round' ? setTab('round') : load(); }
function go(n) { OFF = n === 0 ? 0 : OFF + n; OPEN = null; QEDIT = null; load(); }
function render() {
  if (TAB === 'round') return;
  const names = { '-1': 'เมื่อวาน', '0': 'วันนี้', '1': 'พรุ่งนี้' };
  $('date').textContent = D.day;
  $('ttl').textContent = 'งาน' + (names[OFF] || (OFF < 0 ? ` ${-OFF} วันก่อน` : ` อีก ${OFF} วัน`));
  const rel = names[OFF] || (OFF < 0 ? `${-OFF} วันก่อน` : `อีก ${OFF} วัน`);
  $('dnav').innerHTML = `<button class="dn" onclick="go(-1)" aria-label="วันก่อน">‹</button><label class="dn mid${OFF ? '' : ' on'}" style="position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer">${D.day} (${rel})<input type="date" id="dpick" min="${isoOff(-30)}" max="${isoOff(14)}" value="${isoOff(OFF)}" onchange="pickDay(this.value)" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer"></label><button class="dn" onclick="go(1)" aria-label="วันถัดไป">›</button>${OFF ? '<button class="dn today" onclick="go(0)">วันนี้</button>' : ''}`;
  $('newt').placeholder = OFF ? `เพิ่มงานวันที่ ${D.day}` : 'เพิ่มงาน เช่น สมชาย CBC';
  const all = D.tasks;
  $('count').textContent = (PENDING ? '⏳ ' : '') + 'ค้าง ' + all.filter(t => !t.done && !t.flap).length;
  const blds = ['ทั้งหมด', ...new Set(all.map(t => t.bld))];
  if (!blds.includes(BLD)) BLD = 'ทั้งหมด';
  $('chips').innerHTML = blds.map(b => `<button class="chip${b === BLD ? ' on' : ''}" onclick="BLD='${esc(b)}';render()">${esc(short(b))}</button>`).join('');
  $('notices').innerHTML = newsBar() + (D.notices.length ? `<div class="notice">${D.notices.map(esc).join(' · ')}</div>` : '');
  const ts = all.filter(t => BLD === 'ทั้งหมด' || t.bld === BLD);
  let h = '';
  const fl = ts.filter(t => t.flap && !t.done);
  if (fl.length) h += '<div><div class="sec">Flap</div><div style="display:flex;flex-direction:column;gap:8px">' + fl.map(flapCard).join('') + '</div></div>';
  const open = ts.filter(t => !t.flap && !t.done);
  if (open.length) h += '<div><div class="sec">งานค้าง (' + open.length + ')</div><div style="display:flex;flex-direction:column;gap:8px">' + byPatient(open) + '</div></div>';
  const done = ts.filter(t => t.done);
  if (done.length) h += '<div><div class="sec">เสร็จแล้ว (' + done.length + ')</div><div style="display:flex;flex-direction:column;gap:8px">' + byPatient(done) + '</div></div>';
  $('main').innerHTML = h || '<div class="empty">ไม่มีงาน 🎉</div>';
}

function byPatient(list) {
  const groups = [];
  list.forEach(t => { const k = t.pt + '|' + t.ward; let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, pt: t.pt, ward: t.ward, items: [] }); g.items.push(t); });
  return groups.map(g => `<div class="card"><div class="pthead">${esc(g.pt)}<span>${esc(g.ward)}</span></div>${g.items.map(taskRow).join('')}</div>`).join('');
}
function taskRow(t) {
  const isOpen = OPEN === t.no;
  const nw = isNewT(t) ? '<span class="tag new">ใหม่</span>' : isNewR(t) ? '<span class="tag res">ผลใหม่</span>' : '';

    ${t.result ? `<div class="res${t.done ? '' : ' upd'}">→ ${esc(t.result)}</div>` : ''}
    ${isOpen ? '' : '<!--'}<div class="meta">${t.no}. ${t.done ? 'ปิดโดย ' + esc(t.doneBy) + ' ' + esc(t.doneAt) : 'ลงโดย ' + esc(t.by)}</div>${isOpen ? '' : '-->'}</span></button>`;
  if (isOpen && !t.done) h += `<div class="panel">
    <div class="qr">${QUICK.map(q => `<button class="qrb" onclick="closeNo(${t.no}, '${q}')">${q}</button>`).join('')}</div>
    <input class="inp" id="res${t.no}" placeholder="ผล (ไม่ใส่ก็ได้) เช่น K 3.8">

function flapCard(t) {

const T = no => D.tasks.find(t => t.no === no);
const val = no => ($('res' + no) || {}).value ? $('res' + no).value.trim() : '';
function toggle(no) { SEEN_NO[no] = 1;  OPEN = OPEN === no ? null : no; ARM = null; render(); const i = $('res' + no); if (i) i.focus(); }
function closeT(no) { closeNo(no, val(no)); }

function cancelT(no) { if (ARM !== 'c' + no) { ARM = 'c' + no; return render(); } run(`ww ยกเลิก ${no}`, () => D.tasks = D.tasks.filter(t => t.no !== no)); }
