<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SiriplasWW</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiriplasWW">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--hd:#1d4ed8;--bg:#fff;--bg2:#f4f5f7;--tx:#111827;--tx2:#374151;--mu:#6b7280;--ln:#eceef1;--g:#059669;--g2:#059669;--or:#d97706;--orbg:#fff7ed;--orx:#b45309;--rd:#dc2626;--bl:#1e40af;--card:#fff;--inv:#111827;--invt:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--bg2:#1c1f26;--tx:#e5e7eb;--tx2:#d1d5db;--mu:#9ca3af;--ln:#262a31;--g:#34d399;--g2:#10b981;--or:#fbbf24;--orbg:#2a1d10;--orx:#fdba74;--rd:#f87171;--bl:#93c5fd;--card:#161a20;--inv:#e5e7eb;--invt:#0f1115}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:15px;color:inherit}
input,textarea,select,.inp,textarea.inp{font-size:16px!important}   /* iPhone ซูมเองถ้าช่องพิมพ์เล็กกว่า 16px */
header{background:var(--bg);border-top:4px solid var(--hd);background-clip:padding-box;padding:12px 16px 0;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top>div{display:flex;align-items:baseline;gap:8px;flex-direction:row-reverse}
.date{font-size:13px;color:var(--mu)}
h1{margin:0;font-size:20px;font-weight:700}
.pill{background:none;border:0;color:var(--mu);font-size:13px;padding:4px 0;white-space:nowrap}
.pill:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-right:6px}
.rf{width:36px;height:36px;border:0;border-radius:50%;background:var(--bg2);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.rf svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loadbar{position:fixed;top:0;left:0;right:0;height:4px;z-index:7;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.85) 50%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat}
body.loading .loadbar{opacity:1;animation:lb 1s ease-in-out infinite}
@keyframes lb{from{background-position:-40% 0}to{background-position:140% 0}}
.upd{font-size:11px;color:var(--mu);margin-left:6px;white-space:nowrap}.upd.old{color:var(--or)}
.rtab .pill:before{display:none}
.tabs{display:flex;gap:20px;margin-top:6px}
.tab{border:0;background:none;padding:8px 0;color:var(--mu);font-weight:500;border-bottom:2px solid transparent;min-height:38px}
.tab.on{color:var(--tx);border-bottom-color:var(--hd)}
.dnav{display:flex;gap:6px;align-items:center;padding:8px 0 0}
.dn{min-height:32px;min-width:36px;border:0;border-radius:8px;background:var(--bg2);color:var(--tx);font-size:16px}
.dn.mid{flex:1;font-size:13px;color:var(--tx2);background:var(--bg2)}
.dn.today{font-size:13px;padding:0 12px;background:var(--inv);color:var(--invt);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chip{flex-shrink:0;min-height:30px;padding:2px 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-size:13px}
.chip.on{background:var(--inv);color:var(--invt);font-weight:600}
.ww{font-size:13px;color:var(--bl);margin-top:3px}
.gbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.gchip{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;min-height:30px;padding:2px 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-size:13px}
.gchip.on{background:var(--inv);color:var(--invt);font-weight:600}
.gchip.warn{color:var(--rd)}.gchip.warn.on{background:var(--rd);color:#fff}
.who{font-size:12px;color:var(--mu);margin-top:2px}.nobody{color:var(--rd);font-weight:500}
.hn{font-weight:400;font-size:13px;color:var(--mu);margin-left:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mu);flex-shrink:0;white-space:nowrap}
.badge:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--or)}
.badge.ok{color:var(--g)}.badge.ok:before{display:none}
.badge.fl:before{background:var(--orx)}
.hist{border-left:2px solid var(--ln);padding-left:10px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.notice{padding:8px 16px;font-size:13px;color:var(--or)}
main{padding:4px 0 120px;display:flex;flex-direction:column;gap:4px}
.inact .row{opacity:.5}.itag{font-size:11px;font-weight:600;color:var(--mu);border:1px solid var(--ln);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
textarea.inp{resize:vertical;line-height:1.45;min-height:44px;overflow:hidden;font-family:inherit;font-size:15px}select.inp{appearance:auto}
.stsel{flex-shrink:0;min-height:30px;padding:2px 10px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-family:inherit}.stsel.on{background:var(--inv);color:var(--invt);font-weight:600}
.fbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 16px 4px}
.fsel{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px;padding:0 10px;border-radius:10px;background:var(--bg2);color:var(--tx2);font-size:14px;overflow:hidden}
.fsel span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fsel:after{content:'▾';font-size:11px;color:var(--mu)}
.fsel.on{background:var(--inv);color:var(--invt);font-weight:600}.fsel.on:after{color:var(--invt)}
.fsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.fbar2{display:flex;gap:6px;padding:4px 16px 6px;flex-wrap:wrap}.fbar2:empty{display:none}
.fut{opacity:.55}.fut .meta{color:var(--or);font-weight:600}
.seg3{display:inline-flex;background:var(--bg2);border-radius:999px;padding:2px}.seg3 button{border:0;background:none;color:var(--mu);font-size:13px;padding:4px 10px;border-radius:999px;min-height:28px}.seg3 button.on{background:var(--inv);color:var(--invt);font-weight:600}
.gchip.due{color:var(--or)}.gchip.due.on{background:var(--or);color:#fff}.itag.duet{color:var(--or);border-color:var(--or)}
.duebar{display:block;width:100%;text-align:left;border:0;background:var(--orbg);color:var(--orx);padding:9px 16px;font-size:13px}
.pop .box{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop .tt{animation:fadeok .6s}@keyframes fadeok{0%{color:var(--g)}100%{}}
.thx{margin-top:3px;font-size:12px}.thb{display:inline-block;margin-top:4px;color:var(--tx2);cursor:pointer;padding:6px 12px;border-radius:999px;background:var(--bg2)}.thb.on{color:var(--or);font-weight:600}.thn{color:var(--or)}
.burst{position:fixed;left:50%;top:45%;font-size:56px;transform:translate(-50%,-50%);animation:burst .9s ease-out forwards;pointer-events:none;z-index:30}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.fest header{border-top:0;box-shadow:inset 0 5px 0 -1px transparent}.fest header:before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--bar)}header{position:sticky}.fxi{font-size:16px;margin-left:2px}
.chev{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--mu)}.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.itag.late{color:var(--rd);border-color:var(--rd)}
.mk{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--mu);flex-shrink:0;margin-top:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}.mk.d{background:var(--g2);border-color:var(--g2)}.mk.f{border-color:var(--orx);border-style:dashed}.fltag{font-size:11px;color:var(--orx);font-weight:600}
.nitem{display:block;width:100%;text-align:left;border:0;background:var(--bg2);border-radius:10px;padding:10px 12px;color:var(--tx);margin-bottom:6px}
.flash{animation:flash 2.2s ease}@keyframes flash{0%,40%{background:rgba(29,78,216,.18)}100%{background:transparent}}
.sbox{max-width:600px;margin:0 auto}
.ehead{position:sticky;top:-16px;z-index:2;background:var(--bg);margin:-16px -16px 0;padding:14px 16px 10px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.ehead .b{min-height:36px;padding:0 12px}
.egrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ef{display:flex;flex-direction:column;gap:4px;min-width:0}.ef.w{grid-column:1/-1}
.ef textarea.inp{min-height:44px}
.esave{width:100%;min-height:46px}
.emore{border-top:1px solid var(--ln);padding-top:10px}.emore summary{cursor:pointer;color:var(--mu);font-size:14px;padding:6px 0;list-style:none}.emore summary:before{content:'▸ '}.emore[open] summary:before{content:'▾ '}.emore .lbl{margin-top:8px;display:block}
.pod{font-size:12px;font-weight:600;color:var(--or,#d97706)}
.sec.cp{cursor:pointer;display:flex;justify-content:space-between;align-items:center}.cpi{font-size:11px;font-weight:600;color:var(--hd);border:1px solid var(--hd);border-radius:999px;padding:0 7px;line-height:18px}
.stale{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--inv,#111);color:var(--invt,#fff);font-size:12px;padding:3px 12px;border-radius:999px;z-index:8;opacity:.85}
.outb{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:8;border:0;border-radius:999px;background:#b45309;color:#fff;font:inherit;font-size:13px;font-weight:600;padding:6px 14px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.adl{display:flex;align-items:baseline;gap:6px;padding:6px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.adl .meta{flex:1}
.ads{font-size:12px;color:var(--or);white-space:nowrap}.ads.ok{color:var(--g)}
.adr{border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}.adr.off{opacity:.5}.adr.warn{border-color:var(--or)}
.adh{display:flex;align-items:center;gap:8px}.adg{display:flex;gap:6px}.adg .inp{min-width:0}.adi{min-height:40px;padding:8px 10px}
.adbar{position:sticky;bottom:-16px;background:var(--bg);margin:0 -16px -16px;padding:10px 16px 16px;border-top:1px solid var(--ln);display:flex;gap:8px}.adbar .b{flex:1;min-height:46px}
.qmv{margin:6px 0 2px}.qmv .inp{min-height:38px;padding:6px 10px;font-size:15px;border-color:var(--or)}
#tabX{display:none}body.isadmin #tabX{display:block}.atab .fab,.atab .add,.atab #chips,.atab #notices,.atab #count{display:none!important}
.amain .ehead{position:static;margin:0;padding:10px 0;border:0;background:none}.amain .adbar{bottom:0;margin:0 -16px}
.adday{margin:14px -16px 2px;padding:9px 16px;background:var(--bg2);border-top:3px solid var(--hd);font-weight:700;font-size:15px;display:flex;justify-content:space-between}.adday span{font-weight:500;color:var(--mu);font-size:13px}.adday+.adc,.adday+.adr{border-top:0}
.dstag{background:#7c3aed;color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:700}.dschk{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap}.adh .dschk{margin-left:auto}
.panel.sp{padding:0;border:0;background:none;margin:0}
.b.adup{border:1.5px dashed var(--hd);color:var(--hd);background:none;font-weight:600}
.adc{border-bottom:1px solid var(--ln);padding:8px 0;display:flex;flex-direction:column;gap:2px}.adt{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.adt .ads{margin-left:auto}
.amain{padding:4px 16px 24px;display:flex;flex-direction:column;gap:10px;max-width:600px;margin:0 auto}
.ver{display:none;text-align:center;font-size:11px;color:var(--mu);opacity:.6;padding:8px 0 90px}
.xrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.xdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--mu)}.xdot.ok{background:var(--g)}.xdot.bad{background:var(--rd)}.xdot.wait{background:var(--or)}
.xraw{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--tx);font:inherit;font-size:14px;padding:9px 0}.xraw span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xsum{font-weight:700;font-size:16px;padding:6px 0}
body.isadmin .ver{display:block}
.newver{position:sticky;top:0;z-index:12;display:block;width:100%;border:0;background:#2563eb;color:#fff;font:inherit;font-size:14px;font-weight:600;padding:10px 12px;text-align:center}
.reqe{text-align:center;padding:18px 16px 8px;display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--mu);font-size:13px}.reqe .b{min-height:40px;padding:0 18px}
.bldh{margin-top:14px;padding:10px 16px;font-size:14px;font-weight:700;color:var(--tx);background:var(--bg2);border-top:3px solid var(--hd)}
.sec{font-size:12px;font-weight:600;color:var(--mu);padding:12px 16px 2px;letter-spacing:.3px}
.card{background:transparent}
.pthead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px 0;font-weight:700;font-size:16px}
.pthead span{font-weight:400;font-size:12px;color:var(--mu)}
.task{}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:44px;padding:7px 16px;border:0;background:none;text-align:left;color:var(--tx);cursor:pointer;transition:transform .15s}
.box{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--mu);opacity:.7;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.done .box{background:var(--g2);border-color:var(--g2);opacity:1}
.done .tt{color:var(--mu)}
.meta{font-size:12px;color:var(--mu);margin-top:2px}
.arr{color:var(--g)}.arr.upd{color:var(--or)}
.res{font-size:13px;color:var(--g)}.res.upd{color:var(--or)}
.urg{color:var(--rd);font-weight:600;font-size:13px;margin-right:4px}
.panel{padding:4px 16px 12px 48px;display:flex;flex-direction:column;gap:8px}
.inp{min-height:42px;padding:8px 12px;border:1px solid var(--ln);background:var(--bg2);border-radius:10px;width:100%;color:var(--tx)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--bg2);color:var(--tx2);cursor:pointer;font-size:14px}
.b.p{background:var(--hd);color:#fff;font-weight:600;flex-grow:1}
.b.o{background:var(--or);color:#fff;font-weight:600}
.b.r{color:var(--rd)}
.flap{margin:4px 16px;background:var(--orbg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.flap .q{font-weight:700;color:var(--orx)}
.flap .b{background:transparent;min-height:32px;padding:0 4px;color:var(--mu)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qb{min-height:34px;padding:2px 12px;border-radius:999px;border:0;background:var(--card);color:var(--orx)}
.qb.on{background:var(--or);color:#fff;font-weight:600}
.qb.stop.on{background:var(--mu);color:#fff}
.add{position:fixed;left:0;right:0;bottom:var(--kb,0px);background:var(--bg);border-top:1px solid var(--ln);padding:10px 12px 16px;display:none;gap:8px;z-index:6}
body.adding .add{display:flex}.rtab .fab{display:none}.rtab.canedit .fab{display:block}body.adding .fab{display:none}
.add .b.p{flex-grow:0}
.fab{position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;background:var(--hd);color:#fff;font-size:28px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qrb{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--g);font-size:14px}
.undo{border:0;background:var(--invt);color:var(--inv);border-radius:8px;min-height:34px;padding:0 12px;font-weight:600;margin-left:8px}
.news{display:block;width:100%;text-align:left;border:0;background:var(--bg2);color:var(--bl);font-weight:600;padding:9px 16px;font-size:13px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag.new{background:var(--hd);color:#fff}.tag.res{background:var(--g2);color:#fff}
.isnew .tt{font-weight:500}
.links{display:flex;gap:18px;margin-top:6px}.links a,.links button{background:none;border:0;padding:4px 0;color:var(--mu);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:4px;cursor:pointer}
.links svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prow{border-bottom:1px solid var(--ln)}
.sheet{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sbox{background:var(--bg);width:100%;max-height:calc(var(--vvh,100vh) - 24px);overflow:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.sbox h3{margin:0;font-size:18px}.lbl{font-size:12px;font-weight:600;color:var(--mu)}
.chip2{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--tx2)}
.chip2.on{background:var(--inv);color:var(--invt);font-weight:600}
.prog{font-size:14px;white-space:pre-line}
.toast{align-items:center;position:fixed;left:12px;right:12px;bottom:90px;background:var(--inv);color:var(--invt);border-radius:12px;padding:10px 14px;font-size:14px;white-space:pre-line;display:none;z-index:9}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.busy{opacity:.5;pointer-events:none}
input[type=date]{color-scheme:light dark}
</style>
</head>
<body>
<div class="loadbar"></div>
<header>
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="ttl">งานวันนี้</h1></div>
    <span style="display:flex;align-items:center;gap:6px"><span class="pill" id="count">…</span><span class="upd" id="updAt"></span><button class="rf" id="rf" onclick="refreshNow()" aria-label="รีเฟรช"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></span>
  </div>
  <div class="tabs"><button id="tabT" class="tab on" onclick="setTab('task')">งาน</button><button id="tabR" class="tab" onclick="setTab('round')">ราวด์</button><button id="tabA" class="tab" onclick="setTab('admit')">รับใหม่</button><button id="tabX" class="tab" onclick="setTab('admin')">ผู้ดูแล</button></div>
  <div class="dnav" id="dnav"></div>
  <div class="chips" id="chips"></div>
</header>
<div id="notices"></div>
<main id="main"><div class="empty">กำลังโหลด…</div></main>
<div class="toast" id="toast"></div>
<div class="sheet" id="psheet" style="display:none" onclick="if(event.target===this)closePhoto()"><div class="sbox" id="pbox"></div></div>
<form class="add" onsubmit="addTask(event)">
  <label for="newt" style="position:absolute;left:-9999px">เพิ่มงาน</label>

  $('chips').innerHTML = `<label class="fsel${BLD !== 'ทั้งหมด' ? ' on' : ''}" style="width:calc(33.3% - 4px)"><span>${BLD === 'ทั้งหมด' ? 'ตึก' : esc(short(BLD))}</span><select onchange="BLD=this.value;render()">${blds.map(b => `<option value="${esc(b)}"${b === BLD ? ' selected' : ''}>${b === 'ทั้งหมด' ? 'ทุกตึก' : esc(short(b))}</option>`).join('')}</select></label>`;
  const due = R ? R.pts.filter(p => dueToday(p, OFF)) : [];   // ตามวันที่เลือกในแท็บงาน
  const dueBar = due.length ? `<button class="duebar" ${OFF ? 'disabled' : ''} onclick="RDUE=true;RST='';RG='ทุกคน';RBLD='ทั้งหมด';RACT='active';setTab('round')">${OFF ? D.day + ' ต้องไปดู' : 'วันนี้ต้องไปดู'} ${due.length} คน: ${due.slice(0, 6).map(p => esc(p.name.split(/\s+/)[0])).join(', ')}${due.length > 6 ? ' …' : ''}${OFF ? '' : ' ›'}</button>` : '';
  $('notices').innerHTML = newsBar() + dueBar + (D.notices.length ? `<div class="notice">${D.notices.map(esc).join(' · ')}</div>` : '');
  const ts = all.filter(t => BLD === 'ทั้งหมด' || t.bld === BLD);
  let h = '';
  const fl = ts.filter(t => t.flap && !t.done);
  if (fl.length) h += '<div><div class="sec">Flap</div><div style="display:flex;flex-direction:column;gap:8px">' + fl.map(flapCard).join('') + '</div></div>';
  const open = ts.filter(t => !t.flap && !t.done);
  if (open.length) h += '<div><div class="sec">งานค้าง (' + open.length + ')</div><div style="display:flex;flex-direction:column;gap:8px">' + byPatient(open) + '</div></div>';
  const done = ts.filter(t => t.done);
  if (done.length) h += '<div><div class="sec">เสร็จแล้ว (' + done.length + ')</div><div style="display:flex;flex-direction:column;gap:8px">' + byPatient(done) + '</div></div>';
  $('main').innerHTML = h || '<div class="empty">ไม่มีงาน 🎉</div>';
}

function byPatient(list) {
  const groups = [];
  list.forEach(t => { const k = t.pt + '|' + t.ward; let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, pt: t.pt, ward: t.ward, items: [] }); g.items.push(t); });
  return groups.map(g => `<div class="card"><div class="pthead">${esc(g.pt)}<span>${esc(g.ward)}</span></div>${g.items.map(taskRow).join('')}</div>`).join('');
}
function taskRow(t) {
  const isOpen = OPEN === t.no;
  const nw = isNewT(t) ? '<span class="tag new">ใหม่</span>' : isNewR(t) ? '<span class="tag res">อัปเดต</span>' : '';
  let h = `<div id="task${t.no}" class="task${t.done ? ' done' : ''}${nw ? ' isnew' : ''}${POP === t.no && t.done ? ' pop' : ''}"><button class="row" onclick="toggle(${t.no})" ${t.done ? '' : `data-sw="${t.no}"`}>
    <span class="box"${t.done ? '' : ` onclick="event.stopPropagation();closeNo(${t.no}, '')" role="button" aria-label="ปิดงาน"`}>${t.done ? '✓' : ''}</span>
    <span style="flex-grow:1;min-width:0"><div class="tt">${nw}${t.urgent ? '<span class="urg">ด่วน </span>' : ''}${esc(t.rest || t.task)}</div>
    ${t.result ? `<div class="res${t.done ? '' : ' upd'}">→ ${esc(t.result)}</div>` : ''}
    ${t.done ? thankRow(t) : ''}
    ${isOpen ? '' : '<!--'}<div class="meta">${t.no}. ${t.done ? 'ปิดโดย ' + esc(t.doneBy) + ' ' + esc(t.doneAt) : 'ลงโดย ' + esc(t.by)}</div>${isOpen ? '' : '-->'}</span>${isOpen ? '<span class="chev" aria-label="ปิด"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></span>' : ''}</button>`;
  return h + '</div>';
}
function taskPanel(t) {
  const isOpen = true; let h = '';
  if (isOpen && !t.done) h += `<div class="panel sp">
    <div class="qr">${QUICK.map(q => `<button class="qrb" onclick="closeNo(${t.no}, '${q}')">${q}</button>`).join('')}</div>
    <input class="inp" id="res${t.no}" placeholder="ผล (ไม่ใส่ก็ได้) เช่น K 3.8">
    <div class="btns">
      <button class="b p" onclick="closeT(${t.no})">ปิดงาน</button>
      <button class="b" onclick="upd(${t.no})">บันทึกผล (ยังไม่ปิด)</button>
    </div>
    <div class="btns">
      <button class="b" onclick="editT(${t.no})">แก้ข้อความ</button>
      <button class="b r" onclick="cancelT(${t.no})">${ARM === 'c' + t.no ? 'กดอีกครั้งเพื่อยกเลิก' : 'ยกเลิกงาน'}</button>
    </div></div>`;
  if (isOpen && t.done) h += `<div class="panel sp">
    <input class="inp" id="res${t.no}" placeholder="${t.result ? 'พิมพ์ผล' : 'เพิ่มผล เช่น Hb 10'}">
    <div class="btns">
      <button class="b p" onclick="addRes(${t.no})">เพิ่มผล</button>
      ${t.result ? `<button class="b" onclick="fixRes(${t.no})">แก้ผลล่าสุด</button>` : ''}
      <button class="b" onclick="run('ww เปิด ${t.no}', () => Object.assign(T(${t.no}), { done: false }))">เปิดงานใหม่</button>
    </div></div>`;
  return h;
}
function flapCard(t) {
  const ed = QEDIT === t.no, cur = QDRAFT;
  let h = `<div class="flap"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(t.pt)}</b> <span class="q">${freqLabel(t)}</span></div><span class="meta">${esc(t.ward)}</span></div>
    <div style="font-size:14px">${esc(t.rest)}</div>`;
  if (ed) h += `<div class="meta" style="color:var(--orx)">ความถี่</div><div class="qs">
    ${[2, 4, 6, 8].map(n => `<button class="qb${cur === n ? ' on' : ''}" onclick="QDRAFT=${n};QT=[];keepDet();render()">q ${n}</button>`).join('')}
    ${[['เช้า,เย็น,hs', 'ชยhs']].map(([v, l]) => `<button class="qb${QT.join(',') === v ? ' on' : ''}" onclick="QT='${v}'.split(',');QDRAFT=null;keepDet();render()">${l}</button>`).join('')}
    <button class="qb stop${cur === 'stop' ? ' on' : ''}" onclick="QDRAFT='stop';render()">หยุดเฝ้า</button></div>
    ${cur === 'stop' ? '' : `<div class="meta" style="color:var(--orx)">รายละเอียดการเฝ้า (ทำอะไรทุกรอบ)</div><textarea class="inp" id="fdet" rows="2" oninput="grow(this)" placeholder="เช่น ดู color temp doppler · ทำแผล NSS">${esc(FDET != null ? FDET : flapDetail(t))}</textarea>`}
    <div class="btns"><button class="b o" onclick="saveQ(${t.no})">ยืนยัน</button><button class="b" onclick="QEDIT=null;render()">ยกเลิก</button></div>`;
  else h += `<div style="display:flex;justify-content:space-between;align-items:center"><span class="meta">${t.edited ? 'แก้ล่าสุดโดย ' + esc(t.edited.by || '-') + ' ' + esc(t.edited.at) : t.no + '. ลงโดย ' + esc(t.by)}</span><button class="b" style="min-height:34px" onclick="QEDIT=${t.no};QDRAFT=${t.q || 'null'};QT=timesOf(T(${t.no}));FDET=null;render();const f=$('fdet');if(f)grow(f)">แก้</button></div>`;
  return h + '</div>';
}

const T = no => D.tasks.find(t => t.no === no);
const val = no => ($('res' + no) || {}).value ? $('res' + no).value.trim() : '';
// แตะงาน → แผ่นเด้งขึ้น (หน้าตาเดียวกับแตะงานในราวด์)
function toggle(no) { SEEN_NO[no] = 1; OPEN = no; ARM = null; render(); taskSheet(no); }
function taskSheet(no) {
  const t = T(no); if (!t) return;
  const st = t.done ? `<span style="color:var(--g)">✓ เสร็จแล้ว</span> <span class="meta">ปิดโดย ${esc(t.doneBy)} ${esc(t.doneAt)}</span>` : `<span style="color:var(--or)">⏳ ค้าง</span>`;
  $('pbox').innerHTML = `<div class="ehead"><div><h3>${esc(t.pt)}</h3><div class="meta">${esc(t.ward)} · ${OFF === 0 ? 'วันนี้' : esc(D.day)} · ข้อ ${t.no}</div></div><button class="b" onclick="closePhoto()">✕</button></div>
    <div style="font-size:17px">${t.urgent ? '<span class="urg">ด่วน </span>' : ''}${esc(t.rest || t.task)}</div><div>${st}</div>
    ${t.result ? `<div class="res${t.done ? '' : ' upd'}">→ ${esc(t.result)}</div>` : ''}<div class="meta">ลงโดย ${esc(t.by)}</div>${t.done ? thankRow(t) : ''}${taskPanel(t)}`;
  $('psheet').style.display = 'flex'; PTASK = no;
}
let PTASK = null;
function closeT(no) { closeNo(no, val(no)); }
function upd(no) { const v = val(no); if (!v) return toast('พิมพ์ความคืบหน้าในช่องก่อน'); run(`ww update ${no} ${v}`, () => T(no).result = v); }
function editT(no) { const v = val(no); if (!v) return toast('พิมพ์ข้อความใหม่ในช่องก่อน แล้วกดแก้ข้อความ'); run(`ww แก้ ${no} ${v}`, () => T(no).rest = v); }
function cancelT(no) { if (ARM !== 'c' + no) { ARM = 'c' + no; return taskSheet(no); } run(`ww ยกเลิก ${no}`, () => D.tasks = D.tasks.filter(t => t.no !== no)); }
function addRes(no) { const v = val(no); if (!v) return toast('พิมพ์ผลก่อน'); run(`ww เสร็จ ${no} ${v}`, () => T(no).result = v); }
function fixRes(no) { const v = val(no); if (!v) return toast('พิมพ์ผลก่อน'); run(`ww แก้ผล ${no} ${v}`, () => T(no).result = v); }
// ความถี่เฝ้า: q N hr หรือ เช้า / เย็น / hs (เลือกได้หลายอัน)
let QT = [], FDET = null;
const TIMES = ['เช้า', 'เย็น', 'hs'];
const QRE = /q\s*\d+\s*(?:hrs?|ชม\.?|h)?/i;
const timesOf = t => /(^|\s)ชย\s*hs(?=\s|$)/i.test(String(t.rest || '')) ? TIMES.slice() : TIMES.filter(w => new RegExp('(^|\\s)' + w + '(?=\\s|$)', 'i').test(String(t.rest || '')));
const freqLabel = t => t.q ? 'q ' + t.q + ' hr' : (timesOf(t).length === 3 ? 'ชยhs' : timesOf(t).join(' ') || 'เฝ้า');
const keepDet = () => { const f = $('fdet'); if (f) FDET = f.value; };
function flapDetail(t) { let s = String(t.rest || '').replace(QRE, '').replace(/(^|\s)ชย\s*hs(?=\s|$)/ig, ' '); TIMES.forEach(w => s = s.replace(new RegExp('(^|\\s)' + w + '(?=\\s|$)', 'ig'), ' ')); return s.replace(/^\s*(?:เฝ้า|monitor)\s*(?:flap)?\s*/i, '').replace(/\s+/g, ' ').trim(); }
function saveQ(no) {
  const t = T(no);
  if (QDRAFT === 'stop') return run(`ww เสร็จ ${no} หยุดเฝ้า`, () => T(no).done = true);
  const q = QT.length ? null : (QDRAFT || t.q), tm = TIMES.filter(w => QT.includes(w)).join(' ');
  const det = ($('fdet') ? $('fdet').value : flapDetail(t)).replace(/\s+/g, ' ').trim();
  const freq = q ? 'q ' + q + ' hr' : tm;
  const curF = t.q ? 'q ' + t.q + ' hr' : timesOf(t).join(' ');
  if (freq === curF && det === flapDetail(t)) { QEDIT = null; return render(); }
  const rest = `เฝ้า flap${freq ? ' ' + freq : ''}${det ? ' ' + det : ''}`;
  FDET = null;
  run(`ww แก้ ${no} ${t.pt} ${rest}`, () => Object.assign(T(no), { q, rest }));
}
function addTask(e) { e.preventDefault(); const v = $('newt').value.trim(); if (!v) return; $('newt').value = ''; document.body.classList.remove('adding'); run('ww ' + v); }
// ⚡ เปิดแอพ: โชว์ข้อมูลที่เครื่องจำไว้ทันที แล้วค่อยอัปเดตทับ
(() => {
  const cr = LS.get('ww_c_r'); if (cr && cr.pts) { R = cr; LASTR = cr._t || 0; if (cr.canEdit) document.body.classList.toggle('canedit', true); }
  // ข้อมูลที่จำไว้เป็นของเมื่อวาน → ไม่โชว์ (กันขึ้นว่า "วันนี้" ผิดวัน)
  const tl = (() => { const d = new Date(Date.now() + 7 * 3600e3 - 6 * 3600e3); return `${d.getUTCDate()}/${d.getUTCMonth() + 1}/${(d.getUTCFullYear() + 543) % 100}`; })(), same = s => String(s || '').replace(/\b0(\d)/g, '$1') === tl;
  const cd = LS.get('ww_c_d'); if (cd && cd.tasks && same(cd.day)) { D = cd; render(); document.body.insertAdjacentHTML('beforeend', '<i id="stale" hidden></i>'); document.body.classList.add('loading'); const ua = $('updAt'); if (ua) { ua.textContent = 'กำลังอัปเดต…'; ua.classList.add('old'); } }
})();
load(); outBadge(); document.body.insertAdjacentHTML('beforeend', `<div class="ver">SiriplasWW ${APP_VER} · ${APP_DATE}</div>`); setTimeout(outFlush, 3000);
call({ api: 'round' }, r => { if (!r.error) { setR(r); LASTR = Date.now(); if (TAB === 'task' && D) render(); } });

// ⌨️ คีย์บอร์ดขึ้น → ย่อแผ่น/ยกแถบพิมพ์ขึ้นเหนือคีย์บอร์ด แล้วเลื่อนช่องที่พิมพ์ให้อยู่ในจอ
(function () {
  const vv = window.visualViewport; if (!vv) return;
  const fit = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop), r = document.documentElement.style;
    r.setProperty('--vvh', vv.height + 'px'); r.setProperty('--vvt', vv.offsetTop + 'px'); r.setProperty('--kb', kb + 'px');
    document.body.style.paddingBottom = kb ? (kb + 80) + 'px' : '';
  };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
  document.addEventListener('focusin', e => {
    const el = e.target; if (!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    setTimeout(() => { fit(); if (!el.closest('.add')) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 350);
  });
})();
</script>
</body>
