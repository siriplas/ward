<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>งานวันนี้</title>
<style>
:root{--hd:#1d4ed8;--bg:#fff;--bg2:#f4f5f7;--tx:#111827;--tx2:#374151;--mu:#6b7280;--ln:#eceef1;--g:#059669;--g2:#059669;--or:#d97706;--orbg:#fff7ed;--orx:#9a3412;--rd:#dc2626;--bl:#1e40af;--card:#fff;--inv:#111827;--invt:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--bg2:#1c1f26;--tx:#e5e7eb;--tx2:#d1d5db;--mu:#9ca3af;--ln:#262a31;--g:#34d399;--g2:#10b981;--or:#fbbf24;--orbg:#2a1d10;--orx:#fdba74;--rd:#f87171;--bl:#93c5fd;--card:#161a20;--inv:#e5e7eb;--invt:#0f1115}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:15px;color:inherit}
input,textarea,select,.inp,textarea.inp{font-size:16px!important}   /* iPhone ซูมเองถ้าช่องพิมพ์เล็กกว่า 16px */
header{background:var(--bg);border-top:4px solid var(--hd);background-clip:padding-box;padding:12px 16px 0;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top>div{display:flex;align-items:baseline;gap:8px;flex-direction:row-reverse}
.date{font-size:13px;color:var(--mu)}
h1{margin:0;font-size:20px;font-weight:700}
.pill{background:none;border:0;color:var(--mu);font-size:13px;padding:4px 0;white-space:nowrap}
.pill:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-right:6px}
.rf{width:36px;height:36px;border:0;border-radius:50%;background:var(--bg2);color:var(--tx2);display:flex;align-items:center;justify-content:center}
.rf svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loadbar{position:fixed;top:0;left:0;right:0;height:4px;z-index:7;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.85) 50%,transparent 100%);background-size:40% 100%;background-repeat:no-repeat}
body.loading .loadbar{opacity:1;animation:lb 1s ease-in-out infinite}
@keyframes lb{from{background-position:-40% 0}to{background-position:140% 0}}
.upd{font-size:11px;color:var(--mu);margin-left:6px;white-space:nowrap}.upd.old{color:var(--or)}
.tabs{display:flex;gap:20px;margin-top:6px}
.tab{border:0;background:none;padding:8px 0;color:var(--mu);font-weight:500;border-bottom:2px solid transparent;min-height:38px}
.tab.on{color:var(--tx);border-bottom-color:var(--hd)}
.dnav{display:flex;gap:6px;align-items:center;padding:8px 0 0}
.dn{min-height:32px;min-width:36px;border:0;border-radius:8px;background:var(--bg2);color:var(--tx);font-size:16px}
.dn.mid{flex:1;font-size:13px;color:var(--tx2);background:var(--bg2)}
.dn.today{font-size:13px;padding:0 12px;background:var(--inv);color:var(--invt);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chip{flex-shrink:0;min-height:30px;padding:2px 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-size:13px}
.chip.on{background:var(--inv);color:var(--invt);font-weight:600}
.ww{font-size:13px;color:var(--bl);margin-top:3px}
.gbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.gchip{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;min-height:30px;padding:2px 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-size:13px}
.gchip.on{background:var(--inv);color:var(--invt);font-weight:600}
.gchip.warn{color:var(--rd)}.gchip.warn.on{background:var(--rd);color:#fff}
.who{font-size:12px;color:var(--mu);margin-top:2px}.nobody{color:var(--rd);font-weight:500}
.hn{font-weight:400;font-size:13px;color:var(--mu);margin-left:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mu);flex-shrink:0;white-space:nowrap}
.badge:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--or)}
.badge.ok{color:var(--g)}.badge.ok:before{display:none}
.badge.fl:before{background:var(--orx)}
.hist{border-left:2px solid var(--ln);padding-left:10px;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.notice{padding:8px 16px;font-size:13px;color:var(--or)}
main{padding:4px 0 120px;display:flex;flex-direction:column;gap:4px}
.inact .row{opacity:.5}.itag{font-size:11px;font-weight:600;color:var(--mu);border:1px solid var(--ln);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}
textarea.inp{resize:vertical;line-height:1.45;min-height:72px;overflow:hidden;font-family:inherit;font-size:15px}select.inp{appearance:auto}
.stsel{flex-shrink:0;min-height:30px;padding:2px 10px;border-radius:999px;border:0;background:var(--bg2);color:var(--mu);font-family:inherit}.stsel.on{background:var(--inv);color:var(--invt);font-weight:600}
.fbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 16px 4px}
.fsel{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px;padding:0 10px;border-radius:10px;background:var(--bg2);color:var(--tx2);font-size:14px;overflow:hidden}
.fsel span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fsel:after{content:'▾';font-size:11px;color:var(--mu)}
.fsel.on{background:var(--inv);color:var(--invt);font-weight:600}.fsel.on:after{color:var(--invt)}
.fsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.fbar2{display:flex;gap:6px;padding:4px 16px 6px;flex-wrap:wrap}.fbar2:empty{display:none}
.fut{opacity:.55}.fut .meta{color:var(--or);font-weight:600}
.seg3{display:inline-flex;background:var(--bg2);border-radius:999px;padding:2px}.seg3 button{border:0;background:none;color:var(--mu);font-size:13px;padding:4px 10px;border-radius:999px;min-height:28px}.seg3 button.on{background:var(--inv);color:var(--invt);font-weight:600}
.gchip.due{color:var(--or)}.gchip.due.on{background:var(--or);color:#fff}.itag.duet{color:var(--or);border-color:var(--or)}
.duebar{display:block;width:100%;text-align:left;border:0;background:var(--orbg);color:var(--orx);padding:9px 16px;font-size:13px}
.pop .box{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop .tt{animation:fadeok .6s}@keyframes fadeok{0%{color:var(--g)}100%{}}
.thx{margin-top:3px;font-size:12px}.thb{display:inline-block;margin-top:4px;color:var(--tx2);cursor:pointer;padding:6px 12px;border-radius:999px;background:var(--bg2)}.thb.on{color:var(--or);font-weight:600}.thn{color:var(--or)}
.burst{position:fixed;left:50%;top:45%;font-size:56px;transform:translate(-50%,-50%);animation:burst .9s ease-out forwards;pointer-events:none;z-index:30}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.fest header{border-top:0;box-shadow:inset 0 5px 0 -1px transparent}.fest header:before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:var(--bar)}header{position:sticky}.fxi{font-size:16px;margin-left:2px}
.chev{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--mu)}.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.itag.late{color:var(--rd);border-color:var(--rd)}
.bldh{margin-top:14px;padding:10px 16px;font-size:14px;font-weight:700;color:var(--tx);background:var(--bg2);border-top:3px solid var(--hd)}
.sec{font-size:12px;font-weight:600;color:var(--mu);padding:12px 16px 2px;letter-spacing:.3px}
.card{background:transparent}
.pthead{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px 0;font-weight:700;font-size:16px}
.pthead span{font-weight:400;font-size:12px;color:var(--mu)}
.task{}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:44px;padding:7px 16px;border:0;background:none;text-align:left;color:var(--tx);cursor:pointer;transition:transform .15s}
.box{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--mu);opacity:.7;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.done .box{background:var(--g2);border-color:var(--g2);opacity:1}
.done .tt{color:var(--mu)}
.meta{font-size:12px;color:var(--mu);margin-top:2px}
.arr{color:var(--g)}.arr.upd{color:var(--or)}
.res{font-size:13px;color:var(--g)}.res.upd{color:var(--or)}
.urg{color:var(--rd);font-weight:600;font-size:13px;margin-right:4px}
.panel{padding:4px 16px 12px 48px;display:flex;flex-direction:column;gap:8px}
.inp{min-height:42px;padding:8px 12px;border:1px solid var(--ln);background:var(--bg2);border-radius:10px;width:100%;color:var(--tx)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--bg2);color:var(--tx2);cursor:pointer;font-size:14px}
.b.p{background:var(--hd);color:#fff;font-weight:600;flex-grow:1}
.b.o{background:var(--or);color:#fff;font-weight:600}
.b.r{color:var(--rd)}
.flap{margin:4px 16px;background:var(--orbg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.flap .q{font-weight:700;color:var(--orx)}
.flap .b{background:transparent;min-height:32px;padding:0 4px;color:var(--mu)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qb{min-height:34px;padding:2px 12px;border-radius:999px;border:0;background:var(--card);color:var(--orx)}
.qb.on{background:var(--or);color:#fff;font-weight:600}
.qb.stop.on{background:var(--mu);color:#fff}
.add{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:10px 12px 16px;display:none;gap:8px;z-index:6}
body.adding .add{display:flex}.rtab .fab{display:none}body.adding .fab{display:none}
.add .b.p{flex-grow:0}
.fab{position:fixed;right:18px;bottom:22px;width:54px;height:54px;border-radius:50%;border:0;background:var(--hd);color:#fff;font-size:28px;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:6}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qrb{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--g);font-size:14px}
.undo{border:0;background:var(--invt);color:var(--inv);border-radius:8px;min-height:34px;padding:0 12px;font-weight:600;margin-left:8px}
.news{display:block;width:100%;text-align:left;border:0;background:var(--bg2);color:var(--bl);font-weight:600;padding:9px 16px;font-size:13px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag.new{background:var(--hd);color:#fff}.tag.res{background:var(--g2);color:#fff}
.isnew .tt{font-weight:500}
.links{display:flex;gap:18px;margin-top:6px}.links a,.links button{background:none;border:0;padding:4px 0;color:var(--mu);font-size:13px;text-decoration:none;display:flex;align-items:center;gap:4px;cursor:pointer}
.links svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prow{border-bottom:1px solid var(--ln)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sbox{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.sbox h3{margin:0;font-size:18px}.lbl{font-size:12px;font-weight:600;color:var(--mu)}
.chip2{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:var(--bg2);color:var(--tx2)}
.chip2.on{background:var(--inv);color:var(--invt);font-weight:600}
.prog{font-size:14px;white-space:pre-line}
.toast{align-items:center;position:fixed;left:12px;right:12px;bottom:90px;background:var(--inv);color:var(--invt);border-radius:12px;padding:10px 14px;font-size:14px;white-space:pre-line;display:none;z-index:9}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.busy{opacity:.5;pointer-events:none}
input[type=date]{color-scheme:light dark}
</style>
</head>
<body>
<div class="loadbar"></div>
<header>
  <div class="top">
    <div><div class="date" id="date"></div><h1 id="ttl">งานวันนี้</h1></div>
    <span style="display:flex;align-items:center;gap:6px"><span class="pill" id="count">…</span><span class="upd" id="updAt"></span><button class="rf" id="rf" onclick="refreshNow()" aria-label="รีเฟรช"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></span>
  </div>
  <div class="tabs"><button id="tabT" class="tab on" onclick="setTab('task')">งาน</button><button id="tabR" class="tab" onclick="setTab('round')">ราวด์</button></div>
  <div class="dnav" id="dnav"></div>
  <div class="chips" id="chips"></div>
</header>
<div id="notices"></div>
<main id="main"><div class="empty">กำลังโหลด…</div></main>
<div class="toast" id="toast"></div>
<div class="sheet" id="psheet" style="display:none" onclick="if(event.target===this)closePhoto()"><div class="sbox" id="pbox"></div></div>
<form class="add" onsubmit="addTask(event)">
  <label for="newt" style="position:absolute;left:-9999px">เพิ่มงาน</label>
  <input class="inp" id="newt" placeholder="เพิ่มงาน เช่น สมชาย CBC" autocomplete="off">
  <button class="b p" type="submit">เพิ่ม</button>
  <button class="b" type="button" onclick="document.body.classList.remove('adding')" aria-label="ปิด">✕</button>
</form>
<button class="fab" id="fab" aria-label="เพิ่มงาน" onclick="document.body.classList.add('adding');$('newt').focus()">+</button>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw9dsYKGy8pELEBeIatNSjJLFv6W7MGjxhnjj584Z4BUlXN6WEfon-JID4f4eHR9wQ/exec';   // ← วาง URL ของบอท (ลงท้าย /exec)
const TOK = new URLSearchParams(location.search).get('t') || '';
// 🔄 แถบสีด้านบนวิ่งระหว่างโหลด / บันทึก
let LOADING = 0;
const busyOn = () => { LOADING++; document.body.classList.add('loading'); };
const busyOff = () => { LOADING = Math.max(0, LOADING - 1); if (!LOADING) document.body.classList.remove('loading'); };
const call = (q, ok) => { busyOn(); return fetch(API + '?' + new URLSearchParams(Object.assign({ t: TOK }, q))).then(r => r.json()).then(d => { busyOff(); ok(d); }).catch(e => { busyOff(); fail(e); }); };
let OFF = 0, TAB = 'task', R = null, RBLD = 'ทั้งหมด', RG = 'ทุกคน', RST = '', RACT = 'active', RDUE = false, ROPEN = null, D = null, BLD = 'ทั้งหมด', OPEN = null, QEDIT = null, QDRAFT = null, ARM = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 🎨 สีหัวแอพตามสีประจำวัน (วันใหม่เริ่ม 06:00 เหมือนบอท)
// 🎃 ธีมเทศกาล (ช่วงวันที่ เดือน-วัน) → แถบด้านบนเปลี่ยนลาย + ไอคอนเล็กข้างหัว
const THEMES = [
  { id: 'halloween', from: '10-20', to: '10-31', icon: '🎃', bar: 'repeating-linear-gradient(90deg,#f97316 0 18px,#7c3aed 18px 36px)', hd: '#ea580c' },
  { id: 'loykrathong', from: '11-23', to: '11-25', icon: '🪷', bar: 'linear-gradient(90deg,#1e3a8a,#f59e0b,#1e3a8a)', hd: '#1e40af' },
  { id: 'xmas', from: '12-20', to: '12-26', icon: '🎄', bar: 'repeating-linear-gradient(90deg,#dc2626 0 14px,#16a34a 14px 28px)', hd: '#16a34a' },
  { id: 'newyear', from: '12-27', to: '01-03', icon: '🎆', bar: 'linear-gradient(90deg,#f59e0b,#ec4899,#8b5cf6,#06b6d4)', hd: '#8b5cf6' },
  { id: 'songkran', from: '04-12', to: '04-16', icon: '💦', bar: 'repeating-linear-gradient(90deg,#0ea5e9 0 16px,#38bdf8 16px 32px)', hd: '#0284c7' }
];
function festival() {
  const d = new Date(Date.now() + 7 * 3600e3), md = String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  return THEMES.find(t => t.from <= t.to ? md >= t.from && md <= t.to : md >= t.from || md <= t.to);
}
const DAYCOL = ['#b42318', '#a16207', '#be185d', '#15803d', '#c2410c', '#1d4ed8', '#6d28d9'];   // อา จ อ พ พฤ ศ ส
(() => { const d = new Date(Date.now() + 7 * 3600e3 - 6 * 3600e3).getUTCDay(); const fx = festival(); document.documentElement.style.setProperty('--hd', fx ? fx.hd : DAYCOL[d]); if (fx) { document.documentElement.style.setProperty('--bar', fx.bar); document.documentElement.classList.add('fest'); document.addEventListener('DOMContentLoaded', () => { const h1 = document.getElementById('ttl'); if (h1) h1.insertAdjacentHTML('afterend', `<span class="fxi">${fx.icon}</span>`); }); } document.querySelector('meta[name=theme-color]') || document.head.insertAdjacentHTML('beforeend', `<meta name="theme-color" content="${DAYCOL[d]}">`); })();
const short = b => String(b).replace(/^ตึก\s*/, '');

function load() {
  $('count').textContent = '…';
  call({ api: 'data', off: OFF }, set);
}
// 🆕 งาน/ผลใหม่ตั้งแต่เปิดแอพครั้งก่อน (จำในเครื่องนี้ ; ไม่นับที่ตัวเองทำ)
const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let SEEN = null, NEWS = { t: [], r: [] }, SEEN_NO = {};
const MINE = LS.get('ww_mine') || {};
function markMine(no) { if (OFF) return; MINE[D.day + '#' + no] = Date.now(); LS.set('ww_mine', MINE); }
function computeNews() {
  if (OFF !== 0 || !D) { NEWS = { t: [], r: [] }; return; }
  const key = 'ww_seen_' + D.day, prev = LS.get(key);
  if (SEEN === null) { SEEN = prev || D.now; LS.set(key, D.now); }   // ครั้งแรกของวัน = ไม่เตือน
  const mine = t => (MINE[D.day + '#' + t.no] || 0);
  const me = D.me || '\u0000';
  NEWS.t = D.tasks.filter(t => t.addTs > SEEN && t.by !== me && !mine(t));
  NEWS.r = D.tasks.filter(t => t.result && t.resTs > SEEN && t.resTs > mine(t) + 60e3 && !(t.done && t.doneBy === me));
}
const isNewT = t => NEWS.t.includes(t) && !SEEN_NO[t.no], isNewR = t => NEWS.r.includes(t) && !SEEN_NO[t.no];
function newsBar() {
  const nt = NEWS.t.filter(isNewT).length, nr = NEWS.r.filter(isNewR).length;
  if (!nt && !nr) return '';
  const at = new Date(SEEN + 7 * 3600e3).toISOString().slice(11, 16);
  return `<button class="news" onclick="jumpNew()">${nt ? '🆕 งานใหม่ ' + nt : ''}${nt && nr ? ' · ' : ''}${nr ? '📝 ผลใหม่ ' + nr : ''} <span style="font-weight:400">ตั้งแต่ ${at}</span> ›</button>`;
}
function jumpNew() { const el = document.querySelector('.isnew'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

function saveQ(no) {
  const t = T(no);
  if (QDRAFT === 'stop') return run(`ww เสร็จ ${no} หยุดเฝ้า`, () => T(no).done = true);
  const q = QT.length ? null : (QDRAFT || t.q), tm = TIMES.filter(w => QT.includes(w)).join(' ');
  const det = ($('fdet') ? $('fdet').value : flapDetail(t)).replace(/\s+/g, ' ').trim();
  const freq = q ? 'q ' + q + ' hr' : tm;
  const curF = t.q ? 'q ' + t.q + ' hr' : timesOf(t).join(' ');
  if (freq === curF && det === flapDetail(t)) { QEDIT = null; return render(); }
  const rest = `เฝ้า flap${freq ? ' ' + freq : ''}${det ? ' ' + det : ''}`;
  FDET = null;
  run(`ww แก้ ${no} ${t.pt} ${rest}`, () => Object.assign(T(no), { q, rest }));
}
function addTask(e) { e.preventDefault(); const v = $('newt').value.trim(); if (!v) return; $('newt').value = ''; document.body.classList.remove('adding'); run('ww ' + v); }
load();
call({ api: 'round' }, r => { if (!r.error) { R = r; LASTR = Date.now(); if (TAB === 'task' && D) render(); } });
