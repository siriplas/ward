<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บอททดสอบ</title><meta name="theme-color" content="#273246"><meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{--bg:#fff;--bg2:#f4f5f7;--tx:#111827;--ln:#e5e7eb}@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--bg2:#1c1f26;--tx:#e5e7eb;--ln:#262a31}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,sans-serif}
.tchat{position:fixed;inset:0;z-index:60;background:#8ca5c6;display:flex;flex-direction:column}
@media (prefers-color-scheme: dark){.tchat{background:#1b2230}}
.tchat .th{background:#273246;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;padding-top:max(12px,env(safe-area-inset-top))}
.tchat .th b{flex:1;font-size:16px}.tchat .th button{background:none;border:0;color:#fff;font-size:15px;cursor:pointer;padding:4px 6px}
.tchat .tl{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.tchat .tm{max-width:80%;padding:8px 12px;border-radius:18px;white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.45}
.tchat .me{align-self:flex-end;background:#06c755;color:#fff;border-top-right-radius:4px}
.tchat .bot{align-self:flex-start;background:#fff;color:#111;border-top-left-radius:4px}
@media (prefers-color-scheme: dark){.tchat .bot{background:#2b3240;color:#e5e7eb}}
.tchat .tt{font-size:11px;opacity:.7;align-self:flex-end;margin-top:-4px}.tchat .tt.l{align-self:flex-start}
.tchat .tq{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:rgba(0,0,0,.08)}
.tchat .tq button{flex:none;border:1px solid #06c755;color:#06c755;background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.tchat .tf{display:flex;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg)}
.tchat .tf input{flex:1;border:1px solid var(--ln);border-radius:20px;padding:9px 14px;font-size:16px;background:var(--bg2);color:var(--tx);font-family:inherit}
.tchat .tf button{border:0;background:#06c755;color:#fff;border-radius:20px;padding:0 16px;font-size:15px;cursor:pointer;font-family:inherit}
</style></head><body>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
// 💬 แชททดสอบ (เหมือน LINE OA) → คุยกับโปรเจกต์ทดสอบ "ww test" เท่านั้น ไม่แตะระบบจริง
const TEST_API = 'https://script.google.com/macros/s/AKfycbySOfOjLyrX0HcC67ndvkAZecYXpUwsqETsVk3bHVYtnohWcLA7ZLZ4PaVmOSVdA5G4/exec';
let TC = null;
function tchatOpen() {
  TC = LS.get('ww_tchat') || [];
  if (!$('tchat')) document.body.insertAdjacentHTML('beforeend', `<div id="tchat" class="tchat"><div class="th"><b>🧪 บอททดสอบ (ww test)</b><button onclick="tchatClear()">ล้าง</button></div><div class="tl" id="tcl"></div><div class="tq">${['ww', 'เสร็จ', 'help', 'help2', 'แจ้ง', 'รีเซ็ต', 'ทดสอบทั้งหมด'].map(x => `<button onclick="tchatSend('${x}')">${x}</button>`).join('')}</div><div class="tf"><input id="tci" placeholder="พิมพ์คำสั่ง (ไม่ต้องมี ww)" enterkeyhint="send" onkeydown="if(event.key==='Enter'&&!event.isComposing){tchatSend();}"><button onclick="tchatSend()">ส่ง</button></div></div>`);
  tchatDraw(); setTimeout(() => $('tci') && $('tci').focus(), 50);
}
function tchatClose() { const e = $('tchat'); if (e) e.remove(); }
function tchatClear() { TC = []; LS.set('ww_tchat', TC); tchatDraw(); }
function tchatDraw() {
  const l = $('tcl'); if (!l) return;
  const hm = t => new Date(t).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  l.innerHTML = TC.length ? TC.map(m => `<div class="tm ${m.me ? 'me' : 'bot'}">${esc(m.x)}</div><div class="tt ${m.me ? '' : 'l'}">${m.wait ? '…' : hm(m.t)}</div>`).join('') : '<div class="tm bot">สวัสดีครับ 🧪 ที่นี่คุยกับบอทชุดทดสอบ ใช้คนไข้สมมติ (สมชาย · สมหญิง · มานี) ไม่กระทบชีตจริง\nพิมพ์ "รีเซ็ต" เพื่อล้างข้อมูลทดสอบ</div>';
  l.scrollTop = l.scrollHeight;
}
function tchatSend(x) {
  const inp = $('tci'); x = String(x == null ? inp.value : x).trim(); if (!x) return; if (inp && x === inp.value.trim()) inp.value = '';
  let k = LS.get('ww_tkey'); if (!k) { k = prompt('รหัสแชททดสอบ (ครั้งแรกครั้งเดียว)'); if (!k) return; LS.set('ww_tkey', k.trim()); k = k.trim(); }
  const me = { me: 1, x, t: Date.now() }, bot = { x: '…', t: Date.now(), wait: 1 }; TC.push(me, bot); tchatDraw();
  fetch(TEST_API + '?' + new URLSearchParams({ chat: 1, k, t: x })).then(r => r.json()).then(d => {
    if (d.error === 'key') { LS.set('ww_tkey', null); bot.x = '🔑 รหัสไม่ถูก ลองส่งใหม่อีกครั้ง'; } else bot.x = d.msg || '(บอทไม่ตอบ)';
  }).catch(e => { bot.x = '❗ เชื่อมต่อบอททดสอบไม่ได้ (' + (e && e.message || e) + ')'; }).finally(() => {
    delete bot.wait; bot.t = Date.now(); TC = TC.slice(-50); LS.set('ww_tchat', TC); tchatDraw();
  });
}

tchatOpen();
</script></body></html>
