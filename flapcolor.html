<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>วัดสี flap</title><meta name="theme-color" content="#1d4ed8"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff;--bg2:#f4f5f7;--tx:#111827;--mu:#6b7280;--ln:#e5e7eb;--hd:#1d4ed8;--g:#059669;--or:#d97706;--rd:#dc2626}
@media (prefers-color-scheme: dark){:root{--bg:#0f1115;--bg2:#1c1f26;--tx:#e5e7eb;--mu:#9ca3af;--ln:#262a31;--g:#34d399;--or:#fbbf24;--rd:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:15px}
header{border-top:4px solid var(--hd);padding:12px 16px;border-bottom:1px solid var(--ln);padding-top:max(12px,env(safe-area-inset-top))}
header b{font-size:18px}header .mu{font-size:13px}
main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
.mu{color:var(--mu)}
.b{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;cursor:pointer;width:100%}
.b.p{background:var(--hd);color:#fff;border-color:var(--hd)}
.steps{display:flex;gap:6px;margin:12px 0}
.steps button{flex:1;min-height:42px;border-radius:10px;border:2px solid var(--ln);background:var(--bg2);color:var(--tx);font:inherit;font-size:13px;cursor:pointer;line-height:1.2}
.steps button.on{border-color:var(--hd)}
.steps i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.wrap{position:relative;touch-action:manipulation}canvas{width:100%;display:block;border-radius:10px;background:var(--bg2)}
.res{margin-top:12px;border:1px solid var(--ln);border-radius:12px;padding:12px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}.sw{width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.2);flex:none}
.big{font-size:20px;font-weight:700}.ok{color:var(--g)}.warn{color:var(--or)}.bad{color:var(--rd)}
.note{font-size:13px;color:var(--mu);margin-top:10px;line-height:1.5}
</style></head><body>
<header><b>🎨 วัดสี flap</b><div class="mu">แตะ 3 จุดบนรูป → ได้ค่าความต่างของสีเป็นตัวเลข · คำนวณในเครื่อง ไม่ส่งรูปไปไหน</div></header>
<main>
  <label class="b p">📷 ถ่าย / เลือกรูป flap<input type="file" accept="image/*" style="display:none" onchange="load(this.files[0])"></label>
  <div class="steps" id="steps"></div>
  <div class="wrap"><canvas id="cv" height="10"></canvas></div>
  <div id="res"></div>
  <div class="note">• ⚪ <b>อ้างอิง</b> = ก๊อซขาวหรือการ์ดเทาในภาพเดียวกัน (ไม่บังคับ แต่ช่วยปรับแสงให้เทียบข้ามรอบได้)<br>• แตะซ้ำที่จุดเดิมเพื่อย้าย · ใช้เป็นตัวช่วยดูแนวโน้มเท่านั้น ไม่แทนการตรวจ flap</div>
</main>
<script>
const $ = id => document.getElementById(id);
const PTS = { ref: null, flap: null, skin: null }, NAMES = { ref: '⚪ อ้างอิง', flap: '🔴 flap', skin: '🟤 ผิวปกติ' }, COL = { ref: '#ffffff', flap: '#ef4444', skin: '#a16207' };
let MODE = 'flap', IMG = null, R = 12;
function steps() { $('steps').innerHTML = ['flap', 'skin', 'ref'].map(k => `<button class="${MODE === k ? 'on' : ''}" onclick="MODE='${k}';steps()"><i style="background:${COL[k]}"></i>${NAMES[k].slice(2)}${PTS[k] ? ' ✓' : ''}</button>`).join(''); }
function load(f) {
  if (!f) return; const u = URL.createObjectURL(f), im = new Image();
  im.onload = () => { const cv = $('cv'), s = Math.min(1, 1600 / Math.max(im.width, im.height)); cv.width = im.width * s; cv.height = im.height * s; R = Math.max(6, Math.round(cv.width / 80)); IMG = im; PTS.ref = PTS.flap = PTS.skin = null; MODE = 'flap'; draw(); steps(); calc(); };
  im.src = u;
}
function draw() {
  const cv = $('cv'), c = cv.getContext('2d'); if (!IMG) return; c.drawImage(IMG, 0, 0, cv.width, cv.height);
  for (const k in PTS) { const p = PTS[k]; if (!p) continue; c.lineWidth = Math.max(2, R / 4); c.strokeStyle = '#000'; c.strokeRect(p.x - R - 1, p.y - R - 1, 2 * R + 2, 2 * R + 2); c.strokeStyle = COL[k]; c.strokeRect(p.x - R, p.y - R, 2 * R, 2 * R); }
}
function avg(p) {
  const cv = $('cv'), c = cv.getContext('2d'); c.drawImage(IMG, 0, 0, cv.width, cv.height);
  const d = c.getImageData(Math.max(0, p.x - R), Math.max(0, p.y - R), 2 * R, 2 * R).data; let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
  return [r / n, g / n, b / n];
}
$('cv').addEventListener('click', e => {
  if (!IMG) return; const cv = $('cv'), rc = cv.getBoundingClientRect();
  PTS[MODE] = { x: Math.round((e.clientX - rc.left) * cv.width / rc.width), y: Math.round((e.clientY - rc.top) * cv.height / rc.height) };
  PTS[MODE].rgb = avg(PTS[MODE]);
  if (MODE === 'flap' && !PTS.skin) MODE = 'skin'; else if (MODE === 'skin' && !PTS.ref) MODE = 'ref';
  draw(); steps(); calc();
});
// sRGB → Lab (D65)
function lab([r, g, b]) {
  const f = v => { v /= 255; return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92; };
  const R = f(r), G = f(g), B = f(b);
  let X = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047, Y = R * 0.2126 + G * 0.7152 + B * 0.0722, Z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
  const h = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; X = h(X); Y = h(Y); Z = h(Z);
  return [116 * Y - 16, 500 * (X - Y), 200 * (Y - Z)];
}
// ปรับแสงด้วยจุดอ้างอิง: ทำให้จุดอ้างอิงเป็นสีเทากลาง (ค่าเฉลี่ยของมันเอง)
function wb(rgb) { if (!PTS.ref) return rgb; const m = (PTS.ref.rgb[0] + PTS.ref.rgb[1] + PTS.ref.rgb[2]) / 3; return rgb.map((v, i) => Math.min(255, v * m / Math.max(1, PTS.ref.rgb[i]))); }
const hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const f1 = v => (v > 0 ? '+' : '') + v.toFixed(1);
function calc() {
  const el = $('res'); if (!IMG) { el.innerHTML = ''; return; }
  if (!PTS.flap || !PTS.skin) { el.innerHTML = `<div class="res mu">แตะ ${!PTS.flap ? '🔴 บน flap' : '🟤 บนผิวปกติข้างๆ'} ${PTS.flap && !PTS.skin ? '' : ''}</div>`; return; }
  const fc = wb(PTS.flap.rgb), sc = wb(PTS.skin.rgb), F = lab(fc), S = lab(sc);
  const dL = F[0] - S[0], da = F[1] - S[1], db = F[2] - S[2], dE = Math.hypot(dL, da, db);
  const lv = dE < 5 ? ['ok', 'ใกล้เคียงผิวปกติ'] : dE < 12 ? ['warn', 'ต่างพอสังเกต'] : ['bad', 'ต่างมาก'];
  const words = [];
  if (dL <= -5) words.push('คล้ำกว่า'); else if (dL >= 5) words.push('สว่าง/ซีดกว่า');
  if (da >= 5) words.push('แดงกว่า'); else if (da <= -5) words.push('แดงน้อยกว่า (ซีด)');
  if (db <= -5) words.push('ออกม่วง/ฟ้ากว่า'); else if (db >= 5) words.push('ออกเหลืองกว่า');
  el.innerHTML = `<div class="res">
    <div class="row"><div class="sw" style="background:${hex(fc)}"></div><div><b>flap</b> <span class="mu">L ${F[0].toFixed(0)} · a ${F[1].toFixed(0)} · b ${F[2].toFixed(0)}</span></div></div>
    <div class="row"><div class="sw" style="background:${hex(sc)}"></div><div><b>ผิวปกติ</b> <span class="mu">L ${S[0].toFixed(0)} · a ${S[1].toFixed(0)} · b ${S[2].toFixed(0)}</span></div></div>
    <div class="row" style="border-top:1px solid var(--ln);margin-top:6px;padding-top:10px"><div><div class="big ${lv[0]}">ΔE ${dE.toFixed(1)} · ${lv[1]}</div>
    <div>flap ${words.length ? words.join(' · ') : 'สีใกล้เคียงผิวปกติ'}</div>
    <div class="mu" style="font-size:13px">ความสว่าง ${f1(dL)} · แดง ${f1(da)} · เหลือง ${f1(db)}${PTS.ref ? ' · ปรับแสงด้วยจุดอ้างอิงแล้ว ✓' : ' · ⚠️ ยังไม่มีจุดอ้างอิง เทียบข้ามรอบได้ไม่แม่น'}</div></div></div>
  </div>`;
}
steps();
</script></body></html>
